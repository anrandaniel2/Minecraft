plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eaglercraft.minecraft262'
    compileSdk 34

    defaultConfig {
        applicationId "com.eaglercraft.minecraft262"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "26.2-0.6"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
