name: Project checks

# Fast feedback: every GDScript file is parsed, the asset pipeline is verified
# against the committed art, and Godot imports the project headlessly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_CHANNEL: stable

jobs:
  gdscript:
    name: Parse GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: Parse every script
        run: |
          set -euo pipefail
          fail=0
          for file in $(find scripts -name '*.gd' | sort); do
            if ! gdparse "$file" > /tmp/out.txt 2>&1; then
              echo "::error file=$file::$(cat /tmp/out.txt)"
              fail=1
            fi
          done
          exit $fail

  assets:
    name: Regenerate assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild the art and audio
        working-directory: tools
        run: python3 gen_assets.py all
      - name: Check nothing changed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- assets; then
            echo "::warning::Generated assets differ from the committed files"
            git diff --stat -- assets
          fi
          echo "Asset pipeline ran cleanly."

      - name: Import a texture pack and rebuild the atlas at HD
        run: |
          set -euo pipefail
          # A stand-in "Bedrock" pack: committed tiles renamed the way Bedrock
          # names them, so the importer's name matching is exercised for real.
          rm -rf /tmp/pack && mkdir -p /tmp/pack/textures/blocks
          cp assets/generated/blocks/stone.png /tmp/pack/textures/blocks/stone.png
          cp assets/generated/blocks/dirt.png /tmp/pack/textures/blocks/dirt.png
          cp assets/generated/blocks/oak_log_side.png /tmp/pack/textures/blocks/log_oak.png
          cp assets/generated/blocks/wool_red.png /tmp/pack/textures/blocks/wool_colored_red.png
          python3 tools/pack_import.py --pack /tmp/pack --tile 32
          (cd tools && python3 gen_assets.py atlas)
          python3 - <<'PY'
          import json, sys
          manifest = json.load(open("assets/generated/atlas.json"))
          pack = json.load(open("assets/pack/pack.json"))
          print("pack manifest:", pack)
          print("atlas:", manifest["size"], manifest["tile_pixels"], manifest["source"])
          problems = []
          if manifest["tile_pixels"] != 32 or manifest["size"] != 768:
              problems.append("the HD atlas is not 768x768 at 32px per tile")
          if manifest["source"] != "pack":
              problems.append("the atlas did not record the pack as its source")
          matched = len(pack["imported"])
          if matched < 4:
              problems.append("only %d tiles matched the pack" % matched)
          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          PY
          # Clearing the pack must bring the committed 16px art back untouched.
          python3 tools/pack_import.py --clear
          (cd tools && python3 gen_assets.py atlas)
          python3 - <<'PY'
          import json, sys
          manifest = json.load(open("assets/generated/atlas.json"))
          print("restored atlas:", manifest["size"], manifest["tile_pixels"], manifest["source"])
          if manifest["tile_pixels"] != 16 or manifest["source"] != "generated":
              print("::error::clearing the pack did not restore the generated atlas")
              sys.exit(1)
          PY
          if ! git diff --quiet -- assets; then
            echo "::error::clearing the pack left the committed art modified"
            git diff --stat -- assets
            exit 1
          fi
          echo "Texture pack import and reset verified."

  godot-import:
    name: Headless import
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import project
        run: |
          set +e
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          status=${PIPESTATUS[0]}
          set -e
          # Surface the errors (with the file that caused them) as annotations so
          # they are readable from the API even when artifact download is not.
          python3 - <<'PY' || true
          lines = open("/tmp/import.log", errors="replace").read().splitlines()
          shown = 0
          for index, line in enumerate(lines):
              if "SCRIPT ERROR" in line or "Parse Error" in line or "Failed to load script" in line:
                  context = ""
                  for probe in lines[index:index + 5]:
                      if "res://" in probe:
                          context = probe.strip()
                          break
                  print("::error::%s %s" % (line.strip(), context))
                  shown += 1
                  if shown >= 25:
                      break
          print("import errors reported: %d" % shown)
          PY
          echo "godot --import exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::godot --import failed with status $status"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Failed to load script" /tmp/import.log; then
            echo "::error::The project reported script errors while importing"
            exit 1
          fi
      - name: Compile every script
        run: |
          set +e
          timeout 300 godot --headless --path . res://tests/compile_check.tscn \
            2>&1 | tee /tmp/compile.log
          status=${PIPESTATUS[0]}
          set -e
          echo "--- compile log ---"
          tail -30 /tmp/compile.log
          echo "--- end of log ---"
          # Whatever happened goes into the annotation, so it is readable from
          # the API even when the raw log cannot be downloaded.
          details=$(grep -E "Blockcraft: compiled|BROKEN|Compile Error|Parse Error|SCRIPT ERROR" \
            /tmp/compile.log | head -12 | tr '\n' '|' | tr -d '%' || true)
          if [ "$status" -ne 0 ]; then
            echo "::error::The compile check failed (status $status). ${details}"
            exit 1
          fi
          echo "::notice::${details}"

      - name: Upload the import log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-log
          path: /tmp/import.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Load the main scene and quit
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path . --quit-after 120 2>&1 | tee /tmp/run.log || true
          # The menu prints which renderer, driver and worker pool it came up on;
          # all three are the first things worth reading when a build misbehaves
          # on a device that has no console.
          grep -E "Blockcraft: (renderer|display)" /tmp/run.log | head -3 | while read -r line; do
            echo "::notice::$line"
          done || true
          if ! grep -q "Blockcraft: renderer=.* - menu ready" /tmp/run.log; then
            echo "::error::The main scene never reached the menu"
            echo "::error::main-scene log: $(tail -c 700 /tmp/run.log | tr '\n' '|' | tr -d '%')"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR" /tmp/run.log; then
            echo "::error::Runtime script errors on startup"
            echo "::error::main-scene log: $(tail -c 700 /tmp/run.log | tr '\n' '|' | tr -d '%')"
            exit 1
          fi

      - name: Boot the game scene headless
        run: |
          set +e
          timeout 200 godot --headless --path . --quit-after 240 res://scenes/game.tscn \
            2>&1 | tee /tmp/game.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY' || true
          lines = open("/tmp/game.log", errors="replace").read().splitlines()
          shown = 0
          index = 0
          while index < len(lines) and shown < 20:
              line = lines[index]
              wanted = ("SCRIPT ERROR", "Parse Error", "Can't load", "WARNING")
              if any(marker in line for marker in wanted):
                  joined = " | ".join(part.strip() for part in lines[index:index + 3])
                  print("::error::%s" % joined)
                  shown += 1
                  index += 3
                  continue
              index += 1
          print("game-scene errors reported: %d" % shown)
          PY
          if grep -q "step: world ready" /tmp/game.log; then
            echo "::notice::the world finished loading from the editor build"
          else
            echo "::error::The game scene never reported a loaded world"
            echo "::error::game-scene log: $(tail -c 700 /tmp/game.log | tr '\n' '|' | tr -d '%')"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Failed to load script" /tmp/game.log; then
            echo "::error::The game scene reported script errors while running"
            exit 1
          fi
          echo "game scene ran headless (exit status $status)"

      - name: Upload the game-scene log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-scene-log
          path: /tmp/game.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke test
        run: |
          set +e
          timeout 240 godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee /tmp/smoke.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY' || true
          lines = open("/tmp/smoke.log", errors="replace").read().splitlines()
          shown = 0
          index = 0
          # --script runs do not register the autoloads, so anything that needs
          # Settings fails to compile here; the boot step covers that properly.
          noise = ("Identifier not found: Settings", "Failed to compile depended scripts")
          while index < len(lines) and shown < 20:
              line = lines[index]
              if any(marker in line for marker in noise):
                  index += 1
                  continue
              if "FAIL" in line or "SCRIPT ERROR" in line or "Parse Error" in line:
                  joined = " | ".join(part.strip() for part in lines[index:index + 3])
                  print("::error::%s" % joined)
                  shown += 1
                  index += 3
                  continue
              index += 1
          PY
          # The summary line names the content counts the game booted with; it
          # is the only part of the log that is easy to read from a PR check.
          grep -E "SMOKE OK|Blockcraft: " /tmp/smoke.log | tail -2 | while read -r line; do
            echo "::notice::$line"
          done
          if ! grep -q "SMOKE OK" /tmp/smoke.log; then
            echo "::error::The smoke test failed (godot exit status $status)"
            exit 1
          fi
      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: /tmp/smoke.log
          if-no-files-found: ignore
          retention-days: 7
