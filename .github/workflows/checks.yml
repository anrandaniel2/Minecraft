name: Project checks

# Fast feedback: every GDScript file is parsed, the asset pipeline is verified
# against the committed art, and Godot imports the project headlessly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_CHANNEL: stable

jobs:
  gdscript:
    name: Parse GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: Parse every script
        run: |
          set -euo pipefail
          fail=0
          for file in $(find scripts -name '*.gd' | sort); do
            if ! gdparse "$file" > /tmp/out.txt 2>&1; then
              echo "::error file=$file::$(cat /tmp/out.txt)"
              fail=1
            fi
          done
          exit $fail

  assets:
    name: Regenerate assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild the art and audio
        working-directory: tools
        run: python3 gen_assets.py all
      - name: Check nothing changed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- assets; then
            echo "::warning::Generated assets differ from the committed files"
            git diff --stat -- assets
          fi
          echo "Asset pipeline ran cleanly."

  godot-import:
    name: Headless import
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import project
        run: |
          set +e
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          status=${PIPESTATUS[0]}
          set -e
          # Surface the errors (with the file that caused them) as annotations so
          # they are readable from the API even when artifact download is not.
          python3 - <<'PY' || true
          lines = open("/tmp/import.log", errors="replace").read().splitlines()
          shown = 0
          for index, line in enumerate(lines):
              if "SCRIPT ERROR" in line or "Parse Error" in line or "Failed to load script" in line:
                  context = ""
                  for probe in lines[index:index + 5]:
                      if "res://" in probe:
                          context = probe.strip()
                          break
                  print("::error::%s %s" % (line.strip(), context))
                  shown += 1
                  if shown >= 25:
                      break
          print("import errors reported: %d" % shown)
          PY
          echo "godot --import exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::godot --import failed with status $status"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Failed to load script" /tmp/import.log; then
            echo "::error::The project reported script errors while importing"
            exit 1
          fi
      - name: Upload the import log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-log
          path: /tmp/import.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Load the main scene and quit
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path . --quit-after 60 2>&1 | tee /tmp/run.log || true
          if grep -qE "SCRIPT ERROR" /tmp/run.log; then
            echo "::error::Runtime script errors on startup"
            exit 1
          fi
      - name: Boot the game scene headless
        run: |
          set +e
          timeout 200 godot --headless --path . --quit-after 240 res://scenes/game.tscn \
            2>&1 | tee /tmp/game.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY' || true
          lines = open("/tmp/game.log", errors="replace").read().splitlines()
          shown = 0
          index = 0
          while index < len(lines) and shown < 20:
              line = lines[index]
              if "SCRIPT ERROR" in line or "Parse Error" in line or "Can't load" in line:
                  joined = " | ".join(part.strip() for part in lines[index:index + 3])
                  print("::error::%s" % joined)
                  shown += 1
                  index += 3
                  continue
              index += 1
          print("game-scene errors reported: %d" % shown)
          PY
          if grep -qE "SCRIPT ERROR|Failed to load script" /tmp/game.log; then
            echo "::error::The game scene reported script errors while running"
            exit 1
          fi
          echo "game scene ran headless (exit status $status)"

      - name: Upload the game-scene log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-scene-log
          path: /tmp/game.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke test
        run: |
          set +e
          timeout 240 godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee /tmp/smoke.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY' || true
          lines = open("/tmp/smoke.log", errors="replace").read().splitlines()
          shown = 0
          index = 0
          while index < len(lines) and shown < 20:
              line = lines[index]
              if "FAIL" in line or "SCRIPT ERROR" in line or "Parse Error" in line:
                  joined = " | ".join(part.strip() for part in lines[index:index + 3])
                  print("::error::%s" % joined)
                  shown += 1
                  index += 3
                  continue
              index += 1
          PY
          if ! grep -q "SMOKE OK" /tmp/smoke.log; then
            echo "::error::The smoke test failed (godot exit status $status)"
            exit 1
          fi
      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: /tmp/smoke.log
          if-no-files-found: ignore
          retention-days: 7
