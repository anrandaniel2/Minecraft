name: Fetch Minecraft Client JAR (newest)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Minecraft version to fetch (e.g. 26.3, 1.21.11, leave empty for latest release)'
        required: false
        default: ''
  push:
    paths:
      - '.github/workflows/fetch-minecraft.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/01a0c00d-minecraft
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Determine version
        id: version
        run: |
          set -e
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "Using input version: $INPUT_VERSION"
            exit 0
          fi
          echo "Fetching version_manifest_v2.json..."
          # Try piston-meta first, then launchermeta
          curl -sL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o /tmp/manifest.json || curl -sL https://launchermeta.mojang.com/mc/game/version_manifest.json -o /tmp/manifest.json
          cat /tmp/manifest.json | head -c 500
          LATEST=$(jq -r '.latest.release' /tmp/manifest.json)
          echo "Latest release: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          # Also fetch via mcreference as fallback
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Falling back to mcreference..."
            LATEST=$(curl -s https://mcreference.com/download | grep -oP 'Minecraft \K[0-9.]+' | head -n1 || echo "26.3")
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Fetch version JSON and client JAR
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          echo "Target version: $VERSION"
          # Get version manifest to find version json URL
          curl -sL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o /tmp/manifest.json || curl -sL https://launchermeta.mojang.com/mc/game/version_manifest.json -o /tmp/manifest.json
          # Try to find URL for version
          VERSION_URL=$(jq -r --arg v "$VERSION" '.versions[] | select(.id==$v) | .url' /tmp/manifest.json)
          echo "Version JSON URL: $VERSION_URL"
          if [ -z "$VERSION_URL" ] || [ "$VERSION_URL" = "null" ]; then
            echo "Version $VERSION not found in manifest, trying direct meta URL..."
            # Try direct package URL pattern for newer versions (26.x)
            # For 26.3, the URL is https://piston-meta.mojang.com/v1/packages/...
            # We can try to fetch via mcreference or skyrising
            echo "Trying skyrising mc-versions..."
            curl -sL "https://raw.githubusercontent.com/skyrising/mc-versions/master/data/version/${VERSION}.json" -o /tmp/version.json || true
            if [ -f /tmp/version.json ]; then
              CLIENT_URL=$(jq -r '.downloads.client.url' /tmp/version.json)
              echo "Client URL from skyrising: $CLIENT_URL"
            fi
          else
            curl -sL "$VERSION_URL" -o /tmp/version.json
            CLIENT_URL=$(jq -r '.downloads.client.url' /tmp/version.json)
            echo "Client URL: $CLIENT_URL"
          fi

          # Fallback to mcreference parsing if still empty
          if [ -z "$CLIENT_URL" ] || [ "$CLIENT_URL" = "null" ]; then
            echo "Falling back to mcreference page scrape..."
            curl -sL "https://mcreference.com/minecraft-versions/${VERSION}" -o /tmp/mcref.html || curl -sL "https://mcversions.net/download/${VERSION}" -o /tmp/mcref.html
            CLIENT_URL=$(grep -oP 'https://piston-data\.mojang\.com/v1/objects/[a-f0-9]+/client\.jar' /tmp/mcref.html | head -n1)
            echo "Scraped Client URL: $CLIENT_URL"
          fi

          if [ -z "$CLIENT_URL" ] || [ "$CLIENT_URL" = "null" ]; then
            echo "Failed to determine client URL for $VERSION"
            echo "Trying hardcoded newest 26.3 URL..."
            CLIENT_URL="https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar"
            VERSION="26.3"
          fi

          echo "Final Version: $VERSION"
          echo "Final Client URL: $CLIENT_URL"
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "client_url=$CLIENT_URL" >> $GITHUB_ENV
          # Save for next step
          echo "$VERSION" > /tmp/fetch_version.txt
          echo "$CLIENT_URL" > /tmp/fetch_url.txt

      - name: Download client JAR
        run: |
          set -e
          VERSION=$(cat /tmp/fetch_version.txt)
          CLIENT_URL=$(cat /tmp/fetch_url.txt)
          echo "Downloading $CLIENT_URL to minecraft-client-${VERSION}.jar ..."
          curl -L --fail --show-error -o "minecraft-client-${VERSION}.jar" "$CLIENT_URL"
          ls -lh "minecraft-client-${VERSION}.jar"
          # Verify it's a valid JAR (ZIP)
          file "minecraft-client-${VERSION}.jar" || true
          unzip -l "minecraft-client-${VERSION}.jar" | head -n 20 || true
          # SHA1
          sha1sum "minecraft-client-${VERSION}.jar" | tee /tmp/sha1.txt
          cat /tmp/sha1.txt
          # Also copy to generic name
          cp "minecraft-client-${VERSION}.jar" minecraft-client.jar
          cp "minecraft-client-${VERSION}.jar" "minecraft-client-latest.jar"
          # Also keep previous synthetic as backup?
          ls -lh minecraft-client*.jar

      - name: Download server JAR (optional, for completeness)
        run: |
          set -e
          VERSION=$(cat /tmp/fetch_version.txt)
          # Get server URL from version.json if available
          if [ -f /tmp/version.json ]; then
            SERVER_URL=$(jq -r '.downloads.server.url // empty' /tmp/version.json)
            if [ -n "$SERVER_URL" ] && [ "$SERVER_URL" != "null" ]; then
              echo "Downloading server $SERVER_URL ..."
              curl -L --fail -o "minecraft-server-${VERSION}.jar" "$SERVER_URL" || echo "Server download failed"
              ls -lh "minecraft-server-${VERSION}.jar" || true
            fi
          fi

      - name: Update README
        run: |
          cat > /tmp/update_readme.py << 'PY'
          import re, pathlib, datetime, os, json
          version = open('/tmp/fetch_version.txt').read().strip()
          url = open('/tmp/fetch_url.txt').read().strip()
          sha1 = open('/tmp/sha1.txt').read().split()[0] if pathlib.Path('/tmp/sha1.txt').exists() else 'unknown'
          # Get size
          import os
          size = os.path.getsize(f'minecraft-client-{version}.jar') if pathlib.Path(f'minecraft-client-{version}.jar').exists() else 0
          size_mb = size / 1024 / 1024
          readme = pathlib.Path('README.md')
          content = readme.read_text()
          # Insert or replace a section about newest fetch
          today = datetime.date.today().isoformat()
          new_section = f"\n## ✅ Latest Fetch ({today}) - Minecraft {version}\n\nFetched **newest release `{version}`** directly from Mojang via GitHub Actions (`piston-data.mojang.com`).\n- **File:** `minecraft-client-{version}.jar` ({size_mb:.1f} MB, SHA1 `{sha1}`)\n- **URL:** `{url}`\n- **Generic:** `minecraft-client.jar` and `minecraft-client-latest.jar` are copies of the same file.\n- **Method:** GitHub Actions runner (ubuntu-latest) with `curl -L` – bypasses E2B proxy egress restriction (which only allows `github.com`/`api.github.com`).\n- **Verification:** `sha1sum`, `unzip -l`, `file` in workflow log.\n\n"
          # If section exists, replace, else append
          if "## ✅ Latest Fetch" in content:
              content = re.sub(r'## ✅ Latest Fetch.*?(?=\n## |\Z)', new_section.strip(), content, flags=re.DOTALL)
              # Ensure after replacement we have newline
              if new_section.strip() not in content:
                  content += new_section
          else:
              content += new_section
          readme.write_text(content)
          print("README updated")
          PY
          python3 /tmp/update_readme.py
          cat README.md | head -n 100

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add minecraft-client*.jar minecraft-server*.jar README.md || true
          # Also stage version-specific files
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          VERSION=$(cat /tmp/fetch_version.txt)
          git commit -m "Fetch newest Minecraft client ${VERSION} from Mojang

          - Fetched via GitHub Actions (piston-data.mojang.com) bypassing E2B egress
          - Client: minecraft-client-${VERSION}.jar ($(du -h minecraft-client-${VERSION}.jar | cut -f1), SHA1 $(cut -d' ' -f1 /tmp/sha1.txt))
          - Generic copies: minecraft-client.jar, minecraft-client-latest.jar
          - Workflow: .github/workflows/fetch-minecraft.yml"
          git push origin HEAD:arena/01a0c00d-minecraft

