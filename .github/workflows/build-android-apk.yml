name: Build Godot Android Java viewport APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot_extension/**'
      - 'extracted/assets/**'
      - 'extracted/net/minecraft/client/**'
      - 'full_client_port/renderpearl_backend/java/**'
      - 'tools/fetch_minecraft_libraries.py'
      - 'tools/package_extracted_client.py'
      - 'tools/redirect_graphics_backend.py'
      - 'tools/stage_minecraft_assets.py'
      - 'tools/verify_extracted_native_image.py'
      - 'tools/verify_minecraft_resource_pack.py'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

# The extracted client must be imaged on an AArch64 Linux host: GraalVM Native
# Image does not cross-compile its guest architecture. Android's official NDK
# does not ship an ARM Linux host toolchain, so the image job uses native ARM
# clang with the NDK bionic sysroot and the packaging job uses the x86_64 NDK
# compiler for the small C bridge.
jobs:
  android-ndk-sysroot:
    name: Prepare Android bionic sysroot for the AArch64 image builder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 29.0.14206865

    steps:
      - name: Set up Java for sdkmanager
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the official Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$RUNNER_TEMP/android-cmdline-tools"
            curl --fail --location --retry 5 --retry-all-errors \
              -o "$RUNNER_TEMP/cmdline-tools.zip" \
              'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;${ANDROID_NDK_VERSION}"

      - name: Stage only the target sysroot and compiler runtime
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          test -d "$NDK/sysroot"
          RESOURCE_DIR="$(find "$NDK/lib/clang" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$RESOURCE_DIR"
          mkdir -p "$RUNNER_TEMP/android-bionic-toolchain"
          cp -a "$NDK/sysroot" "$RUNNER_TEMP/android-bionic-toolchain/"
          mkdir -p "$RUNNER_TEMP/android-bionic-toolchain/clang"
          cp -a "$RESOURCE_DIR" "$RUNNER_TEMP/android-bionic-toolchain/clang/"

      - name: Upload Android bionic sysroot
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-android-bionic-sysroot
          path: ${{ runner.temp }}/android-bionic-toolchain
          if-no-files-found: error
          retention-days: 1

  android-graal-arm64:
    name: Build extracted Java/Graal image for Android arm64
    needs: android-ndk-sysroot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_API_LEVEL: '30'
      ANDROID_NDK_VERSION: 29.0.14206865

    steps:
      - uses: actions/checkout@v4

      - name: Add swap for the extracted-client native image
        continue-on-error: true
        run: |
          set +e
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h
          df -h /
          exit 0

      - name: Install GraalVM JDK 25 with Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the Android bionic sysroot
        uses: actions/download-artifact@v4
        with:
          name: minecraft-android-bionic-sysroot
          path: ${{ runner.temp }}/android-bionic-toolchain

      - name: Prepare an ARM GCC driver for the bionic sysroot
        run: |
          set -euo pipefail
          SYSROOT="$RUNNER_TEMP/android-bionic-toolchain/sysroot"
          if [[ ! -d "$SYSROOT" ]]; then
            SYSROOT="$(find "$RUNNER_TEMP/android-bionic-toolchain" -type d -name sysroot -print -quit)"
          fi
          HOST_CC="$(command -v gcc || command -v cc || command -v clang || true)"
          test -n "$SYSROOT"
          test -d "$SYSROOT/usr/include"
          test -n "$HOST_CC"
          echo "Using host compiler $HOST_CC on $(uname -m)"
          "$HOST_CC" --version | head -n 1
          cat > "$RUNNER_TEMP/android-aarch64-gcc" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SYSROOT="$ANDROID_BIONIC_SYSROOT"
          API_LIB="$SYSROOT/usr/lib/aarch64-linux-android30"
          API_LIB_FALLBACK="$SYSROOT/usr/lib/aarch64-linux-android/30"
          if [[ -d "$API_LIB_FALLBACK" ]]; then
            API_LIB="$API_LIB_FALLBACK"
          fi
          exec "$ANDROID_HOST_CC" \
            --sysroot="$SYSROOT" \
            -B"$API_LIB/" \
            -L"$API_LIB" \
            -static-libgcc \
            "$@"
          EOF
          chmod +x "$RUNNER_TEMP/android-aarch64-gcc"
          echo "ANDROID_BIONIC_SYSROOT=$SYSROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOST_CC=$HOST_CC" >> "$GITHUB_ENV"
          echo "MINECRAFT_NATIVE_COMPILER_PATH=$RUNNER_TEMP/android-aarch64-gcc" >> "$GITHUB_ENV"

      - name: Download extracted-client runtime libraries
        run: |
          set -euo pipefail
          java -version
          native-image --version
          python3 tools/fetch_minecraft_libraries.py

      - name: Build the extracted 26.3 client as an Android bionic AArch64 image
        run: |
          set -euo pipefail
          chmod +x godot_extension/build.sh
          if ! MINECRAFT_NATIVE_TARGET=android-aarch64 \
            MINECRAFT_NATIVE_COMPILER_PATH="$MINECRAFT_NATIVE_COMPILER_PATH" \
            MINECRAFT_DISABLE_TOOLCHAIN_CHECK=1 \
            MINECRAFT_SKIP_BRIDGE_BUILD=1 \
            ./godot_extension/build.sh > "$RUNNER_TEMP/android-native-image.log" 2>&1; then
            tail -n 160 "$RUNNER_TEMP/android-native-image.log"
            exit 1
          fi
          tail -n 80 "$RUNNER_TEMP/android-native-image.log"
          test -s godot_extension/bin/libminecraft_java.so
          test -s godot_extension/build/android/generated/minecraft_java.h
          python3 tools/verify_extracted_native_image.py godot_extension/bin/libminecraft_java.so
          file godot_extension/bin/libminecraft_java.so | grep -E 'ARM aarch64|AArch64'
          # A glibc image would install on Linux but is rejected by Android's
          # linker. The Android target must have no GLIBC symbol versioning.
          if readelf --version-info godot_extension/bin/libminecraft_java.so | grep -q GLIBC_; then
            echo 'Android Graal image contains glibc versioned symbols' >&2
            exit 1
          fi

      - name: Upload Android native-image build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-android-native-image-log
          path: ${{ runner.temp }}/android-native-image.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Stage Android extracted-client native image artifact
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/android-native-upload"
          mkdir -p "$RUNNER_TEMP/android-native-upload"
          cp godot_extension/bin/libminecraft_java.so "$RUNNER_TEMP/android-native-upload/"
          cp godot_extension/build/android/generated/minecraft_java.h "$RUNNER_TEMP/android-native-upload/"

      - name: Upload Android extracted-client native image
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-godot-android-extracted-java-arm64
          path: ${{ runner.temp }}/android-native-upload
          if-no-files-found: error
          retention-days: 30

  android-java-viewport-apk:
    name: Package and export Android Java viewport APK
    needs: android-graal-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_TEMPLATE_VERSION: 4.7.2.stable
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_API_LEVEL: '30'
      LWJGL_ANDROID_SHA256: 35ab39ff5d71370829937b87b12e2c49b3e62dc59b564f7ff282a3dbf133a11f

    steps:
      - uses: actions/checkout@v4

      - name: Download the extracted Android Graal image
        uses: actions/download-artifact@v4
        with:
          name: minecraft-godot-android-extracted-java-arm64
          path: ${{ runner.temp }}/android-native

      - name: Install Android SDK and NDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$RUNNER_TEMP/android-cmdline-tools"
            curl --fail --location --retry 5 --retry-all-errors \
              -o "$RUNNER_TEMP/cmdline-tools.zip" \
              'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install the Java image and link the Android arm64 bridge
        run: |
          set -euo pipefail
          mkdir -p godot_extension/bin godot_extension/build/android/generated
          cp "$RUNNER_TEMP/android-native/libminecraft_java.so" godot_extension/bin/libminecraft_java.so
          cp "$RUNNER_TEMP/android-native/minecraft_java.h" godot_extension/build/android/generated/minecraft_java.h
          chmod +x godot_extension/build_android_bridge.sh
          ./godot_extension/build_android_bridge.sh

      - name: Install the mobile LWJGL core native
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lwjgl-android-arm64.zip"
          curl --fail --location --retry 8 --retry-all-errors \
            -o "$archive" \
            'https://github.com/FlameLaunchers/FlameLauncher-SDL3/releases/download/lwjgl-v3.4.3-1/lwjgl-android-arm64-v8a.zip'
          echo "$LWJGL_ANDROID_SHA256  $archive" | sha256sum --check --strict
          mkdir -p godot_extension/bin
          unzip -j "$archive" '*/liblwjgl.so' -d godot_extension/bin
          test -s godot_extension/bin/liblwjgl.so
          file godot_extension/bin/liblwjgl.so | grep -E 'ARM aarch64|AArch64'
          # The image uses the neutral RenderPearl bridge, so only LWJGL's
          # core JNI dispatcher is needed. Desktop OpenGL/OpenAL/etc. natives
          # are intentionally absent from this APK.
          test "$(find godot_extension/bin -maxdepth 1 -name 'liblwjgl*.so' | wc -l)" -eq 1

      - name: Stage complete Minecraft client resource pack
        run: python3 tools/stage_minecraft_assets.py

      - name: Verify Godot resource renderer inputs
        run: python3 tools/verify_minecraft_resource_pack.py

      - name: Install Godot editor and Android export templates
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$TEMPLATE_DIR"
          if [ -d "$TEMPLATE_DIR/templates" ]; then
            mv "$TEMPLATE_DIR/templates"/* "$TEMPLATE_DIR/"
            rmdir "$TEMPLATE_DIR/templates"
          fi
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Export Android arm64 debug APK with the Java GDExtension enabled
        run: |
          set -euo pipefail
          mkdir -p build
          # The packaging host is x86_64 and must not try to load the arm64
          # entry while exporting. The resulting project descriptor retains
          # only the Android arm64 entry inside the APK.
          cp godot_extension/minecraft.gdextension "$RUNNER_TEMP/minecraft.gdextension.full"
          sed -i '/^linux\./d' godot_extension/minecraft.gdextension
          "$GODOT_BIN" --headless --path godot_extension \
            --export-debug 'Android Debug' "$PWD/build/MinecraftGodot-java-viewport-debug.apk"
          test -s build/MinecraftGodot-java-viewport-debug.apk
          unzip -l build/MinecraftGodot-java-viewport-debug.apk > "$RUNNER_TEMP/apk-list.txt"
          for library in libminecraft_java.so libminecraft_godot.so libSDL3.so liblwjgl.so; do
            grep -q "lib/arm64-v8a/$library" "$RUNNER_TEMP/apk-list.txt" || {
              echo "APK is missing the Android Java viewport library: $library" >&2
              exit 1
            }
          done
          if grep -q 'lib/x86\|lib/x86_64\|lib/armeabi' "$RUNNER_TEMP/apk-list.txt"; then
            echo 'APK contains an unexpected non-arm64 native library' >&2
            exit 1
          fi
          ls -lh build/MinecraftGodot-java-viewport-debug.apk

      - name: Upload verified Android Java viewport APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-godot-android-arm64-java-viewport-debug
          path: build/MinecraftGodot-java-viewport-debug.apk
          if-no-files-found: error
          retention-days: 30
