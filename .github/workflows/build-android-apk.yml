name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot_extension/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2-stable
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java for Android export
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo 'Android command-line tools are not preinstalled; installing an isolated copy.'
            mkdir -p "$RUNNER_TEMP/android-cmdline-tools"
            curl --fail --location --retry 3 \
              -o "$RUNNER_TEMP/cmdline-tools.zip" \
              'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --version
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Godot editor and Android export templates
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$TEMPLATE_DIR"
          # The .tpz itself contains a templates/ root, whereas Godot expects
          # android_debug.apk and android_release.apk directly in TEMPLATE_DIR.
          if [ -d "$TEMPLATE_DIR/templates" ]; then
            mv "$TEMPLATE_DIR/templates"/* "$TEMPLATE_DIR/"
            rmdir "$TEMPLATE_DIR/templates"
          fi
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Export Android arm64 debug APK
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/android-export.log") 2>&1
          mkdir -p build
          # The checked-in GDExtension is Linux x86_64 only. Do not let the
          # Linux desktop library load in the Android export process; Android
          # uses MobileInputFallback until an arm64 renderer bridge exists.
          mv godot_extension/minecraft.gdextension "$RUNNER_TEMP/minecraft.gdextension.linux-x86_64"
          "$GODOT_BIN" --headless --path godot_extension \
            --export-debug 'Android Debug' "$PWD/build/MinecraftGodot-debug.apk"
          test -s build/MinecraftGodot-debug.apk
          unzip -l build/MinecraftGodot-debug.apk | grep -q 'AndroidManifest.xml'
          ls -lh build/MinecraftGodot-debug.apk

      - name: Commit Android export diagnostics on failure
        if: failure()
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/android-export.log" android-export-failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android-export-failure.log
          git commit -m 'Record Android APK export failure' || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-godot-android-arm64-debug
          path: build/MinecraftGodot-debug.apk
          if-no-files-found: error
          retention-days: 30
