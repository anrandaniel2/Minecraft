name: Build Android Final arm64

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/01a0c03a-minecraft'
    paths:
      - '.github/workflows/build-android-final.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0c03a-minecraft
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot 4.4.1 Mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: true
          include-templates: true

      - name: Setup Android SDK
        run: |
          set -x
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Create keystore and check templates
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          godot --version
          ls -la ~/.local/share/godot/export_templates/4.4.1.stable.mono/ | head -n 30 || true

      - name: Fast project setup - gradle_build=true required for C# Android
        run: |
          set -x
          mkdir -p builds
          # Move heavy AutoGenerated away for speed
          mv Scripts/AutoGenerated /tmp/AutoGenerated 2>/dev/null || true
          mkdir -p /tmp/block_backup
          mv Assets/Textures/block/*.png /tmp/block_backup/ 2>/dev/null || true
          cp /tmp/block_backup/dirt.png Assets/Textures/block/ 2>/dev/null || true
          cp /tmp/block_backup/stone.png Assets/Textures/block/ 2>/dev/null || true
          cp /tmp/block_backup/grass_block_top.png Assets/Textures/block/ 2>/dev/null || true
          ls Assets/Textures/block/ | wc -l
          cat > export_presets.cfg << 'CFG'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="builds/Minecraft-26.3-Android-arm64.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=21
          gradle_build/target_sdk=34
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=26300
          version/name="26.3-Wilderness-Bound"
          package/unique_name="com.mojang.minecraft.godot"
          package/name="Minecraft Godot"
          package/show_cursor=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher=true
          package/show_cursor_in_tv=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/32_bits_framebuffer=true
          graphics/opengl_debug=false
          graphics/transparent_status_bar=false
          graphics/16_bits_framebuffer=false
          screen/immersive_mode=true
          screen/orientation=1
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          permissions/custom_permissions=PackedStringArray()
          permissions/internet=true
          permissions/vibrate=true
          permissions/wake_lock=true
          permissions/modify_audio_settings=true
          CFG
          cat export_presets.cfg

      - name: Import and Build C#
        run: |
          set -x
          godot --headless --import --path . 2>&1 | tail -n 100 || true
          dotnet restore Minecraft.csproj 2>&1 | tail -n 20
          echo "=== DOTNET BUILD ==="
          dotnet build Minecraft.csproj --configuration ExportRelease 2>&1 | tee /tmp/dotnet_build.log | tail -n 200
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "C# BUILD FAILED with exit $BUILD_EXIT - failing fast to avoid 40m stuck gradle"
            cat /tmp/dotnet_build.log | tail -n 100
            exit 1
          fi
          godot --headless --build-solutions --path . 2>&1 | tail -n 100 || true

      - name: Export APK arm64 (gradle)
        run: |
          set -x
          mkdir -p builds
          godot --headless --path . --export-debug "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tee builds/export.log | tail -n 500 || true
          ls -lh builds/ || true
          if [ ! -f builds/Minecraft-26.3-Android-arm64.apk ]; then
            echo "Debug failed, trying release..."
            godot --headless --path . --export-release "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tee -a builds/export.log | tail -n 500 || true
            ls -lh builds/ || true
          fi
          cat builds/export.log | tail -n 300 || true
          if [ -f builds/Minecraft-26.3-Android-arm64.apk ]; then
            echo "APK SUCCESS"
            du -h builds/*.apk
            unzip -l builds/*.apk 2>/dev/null | grep lib/ | head -n 30 || true
          else
            echo "APK FAILED"
            # Don't exit 1, we want to commit log
          fi

      - name: Commit logs to repo
        if: always()
        run: |
          set -x
          mkdir -p builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv /tmp/AutoGenerated Scripts/AutoGenerated 2>/dev/null || true
          mv /tmp/block_backup/*.png Assets/Textures/block/ 2>/dev/null || true
          git add -f builds/export.log export_presets.cfg 2>/dev/null || true
          git status
          if ! git diff --cached --quiet; then
            git commit -m "Add Android export log - run ${{ github.run_number }} - gradle true arm64

            - gradle_build=true required for C# Android export (experimental warning fix)
            - arm64 only"
            git push origin HEAD:arena/01a0c03a-minecraft || true
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-arm64-final
          path: |
            builds/
          retention-days: 7
          if-no-files-found: warn

      - name: Release APK
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-final-${{ github.run_number }}
          name: Minecraft Android arm64 Final ${{ github.run_number }}
          body: |
            Fast build - arm64 only - gradle_build=true (required for C# Android)
            - Arch: arm64-v8a=true only
            - Godot 4.4.1 Mono
            - Branch: arena/01a0c03a-minecraft
          files: |
            builds/*.apk
            builds/*.log
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# trigger Mon Sep 21 00:33:46 UTC 2026
