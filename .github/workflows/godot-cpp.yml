name: Build Godot C++ GDExtension and APK

on:
  push:
    branches:
      - arena/01a0bb79-minecraft
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-gdextension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons clang
          pip install scons

      - name: Clone godot-cpp
        run: |
          cd godot
          if [ ! -d godot-cpp ]; then
            git clone https://github.com/godotengine/godot-cpp -b 4.4 --depth 1
          fi
          ls -lh godot-cpp/

      - name: Build GDExtension Linux
        run: |
          cd godot
          scons platform=linux target=template_release -j$(nproc) || scons platform=linux target=template_debug -j$(nproc) || true
          ls -lh bin/ || true

      - name: Build GDExtension Android arm64
        run: |
          cd godot
          # Setup Android SDK for godot-cpp android build
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393
          scons platform=android target=template_release arch=arm64-v8a -j$(nproc) || true
          ls -lh bin/ || true

      - name: Upload GDExtension
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-gdextension-cpp
          path: |
            godot/bin/*
            godot/src/*.cpp
            godot/src/*.h
          if-no-files-found: warn

      - name: Commit GDExtension binaries
        if: always()
        run: |
          mkdir -p build
          ls -lh godot/bin/ > build/godot-gdextension-info.txt 2>&1 || echo "no bin" > build/godot-gdextension-info.txt
          git config user.email "bot@arena.ai"
          git config user.name "arena bot"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/anrandaniel2/Minecraft.git
          git fetch origin arena/01a0bb79-minecraft || true
          git pull --rebase origin arena/01a0bb79-minecraft || true
          git add build/godot-gdextension-info.txt godot/bin/ || true
          git commit -m "Godot C++ GDExtension build $(date -u) [skip ci]" || true
          git push origin arena/01a0bb79-minecraft || true

  build-godot-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-gdextension
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Godot 4.4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.0
          use-dotnet: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install build tools
        if: always()
        continue-on-error: true
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Import Godot project
        if: always()
        run: |
          godot --headless --import || true
          ls -lh .godot/ || true

      - name: Build Godot Android APK
        if: always()
        run: |
          mkdir -p build/godot
          godot --headless --export-release Android build/godot/Eaglercraft26-Godot.apk || godot --headless --export-debug Android build/godot/Eaglercraft26-Godot-Debug.apk || true
          ls -lh build/godot/ || true

      - name: Upload Godot APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-godot-apk
          path: |
            build/godot/*.apk
          if-no-files-found: warn
