name: Build Android APK - Eaglercraft 26.2 Native

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bb79-minecraft

jobs:
  build-webview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Create debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android-webview/app
          cp debug.keystore android-webview/app/debug.keystore
          cp debug.keystore android/app/debug.keystore || true

      - name: Create icons
        run: |
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for x in range(150,350):
              for y in range(150,250):
                  img.putpixel((x,y), (34,139,34,255))
              for y in range(250,350):
                  img.putpixel((x,y), (139,69,19,255))
          for base in ["android-webview/app/src/main/res", "android/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          print("Icons created")
          PY

      - name: Prepare WebView assets
        run: |
          mkdir -p android-webview/app/src/main/assets
          # Create HTML that loads online 26.2 and also contains offline note
          cat > android-webview/app/src/main/assets/eaglercraft-26.2-0.6.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>Eaglercraft 26.2 Native</title>
            <style>
              body { margin:0; background:#111; color:#fff; font-family: monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
              .logo { font-size:24px; margin-bottom:20px; }
              .btn { background:#777; border:2px solid #000; color:#fff; padding:10px 20px; margin:5px; cursor:pointer; width:200px; text-align:center; }
              .btn:hover { background:#88f; }
            </style>
          </head>
          <body>
            <div class="logo">Eaglercraft 26.2 - 0.6 Native C++ Port</div>
            <div>Loading...</div>
            <script>
              // Redirect to online version after 1s, or show menu
              setTimeout(() => {
                window.location.href = "https://eymenwsmc.site/262/index.html";
              }, 1000);
            </script>
          </body>
          </html>
          HTML
          ls -lh android-webview/app/src/main/assets/

      - name: Build WebView APK
        run: |
          cd android-webview
          # Create gradle wrapper if not exists
          if [ ! -f gradlew ]; then
            echo "Creating gradle wrapper"
            mkdir -p gradle/wrapper
            cat > gradle/wrapper/gradle-wrapper.properties <<'PROP'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROP
            # Use system gradle to build
          fi
          gradle assembleDebug --stacktrace 2>&1 | tee ../webview-build.log
          ls -lh app/build/outputs/apk/debug/ || true
          find . -name "*.apk" -type f

      - name: Upload WebView APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-webview-apk
          path: |
            android-webview/app/build/outputs/apk/debug/*.apk
            webview-build.log
          if-no-files-found: warn

  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Create keystore and icons
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android/app
          cp debug.keystore android/app/debug.keystore
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for base in ["android/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          PY

      - name: Build Native APK
        run: |
          cd android
          gradle assembleDebug --stacktrace 2>&1 | tee ../native-build.log || true
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload Native APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-native-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            native-build.log
          if-no-files-found: warn

  combine:
    runs-on: ubuntu-latest
    needs: [build-webview-apk, build-native-apk]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine and rename
        run: |
          mkdir -p build
          find artifacts -name "*.apk" -type f -exec cp {} build/ \; || true
          ls -lh build/ || true
          cd build
          if ls *.apk 1> /dev/null 2>&1; then
            # Keep largest as main
            largest=$(ls -S *.apk | head -n 1)
            cp "$largest" Eaglercraft26-Android.apk
            # Also create a combined info
            echo "APKs built:" > apk-info.txt
            ls -lh *.apk >> apk-info.txt
            cat apk-info.txt
          else
            echo "No APKs found" > apk-info.txt
          fi
          ls -lh

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-final-apk
          path: |
            build/*.apk
            build/*.txt
          if-no-files-found: warn
