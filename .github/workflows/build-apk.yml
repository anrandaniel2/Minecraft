name: Build Android APK - Eaglercraft 26.2 Native

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bb79-minecraft

jobs:
  build-webview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Debug env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lh $ANDROID_HOME || true
          java -version
          gradle --version
          echo "PWD $(pwd)"
          ls -R | head -n 200

      - name: Install build tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > android-webview/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat local.properties
          cat android-webview/local.properties
          cat android-webview/build.gradle
          cat android-webview/settings.gradle
          cat android-webview/app/build.gradle
          cat android-webview/gradle/wrapper/gradle-wrapper.properties
          ls -lh android-webview/gradlew
          cat android-webview/gradle.properties

      - name: Create debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android-webview/app
          cp debug.keystore android-webview/app/debug.keystore
          ls -lh android-webview/app/debug.keystore

      - name: Create icons
        run: |
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for base in ["android-webview/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          print("Icons created")
          PY

      - name: Prepare WebView assets
        run: |
          mkdir -p android-webview/app/src/main/assets
          cat > android-webview/app/src/main/assets/eaglercraft-26.2-0.6.html <<'HTML'
          <!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://eymenwsmc.site/262/index.html"></head><body>Redirecting to Eaglercraft 26.2...</body></html>
          HTML
          ls -lh android-webview/app/src/main/assets/
          cat android-webview/app/src/main/AndroidManifest.xml

      - name: Build WebView APK with gradle
        run: |
          cd android-webview
          echo "=== Trying gradle ==="
          gradle --version
          gradle assembleDebug --stacktrace --info 2>&1 | tee ../webview-build.log || true
          echo "=== TAIL 500 ==="
          tail -n 500 ../webview-build.log || true
          ls -lh app/build/outputs/apk/debug/ || true
          find . -name "*.apk" -type f -exec ls -lh {} \; || true

      - name: Try wrapper if gradle failed
        if: always()
        run: |
          cd android-webview
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Gradle direct failed, trying ./gradlew"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --info 2>&1 | tee -a ../webview-build.log || true
            tail -n 500 ../webview-build.log || true
            ls -lh app/build/outputs/apk/debug/ || true
          fi

      - name: Create gist with log
        if: always()
        run: |
          if [ -f webview-build.log ]; then
            echo "Creating gist"
            # truncate to 900k to fit gist limit
            head -c 900000 webview-build.log > /tmp/log.txt
            CONTENT=$(cat /tmp/log.txt | jq -Rs .)
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/gists -d "{\"public\": true, \"files\": {\"webview-build.log\": {\"content\": $CONTENT}}}" | tee gist.json
            cat gist.json | jq -r '.html_url // .url' || true
            echo "GIST_URL=$(cat gist.json | jq -r '.html_url')" >> $GITHUB_ENV
          fi

      - name: Commit logs to repo
        if: always()
        run: |
          mkdir -p build
          cp webview-build.log build/webview-build.log || true
          cp gist.json build/gist-webview.json || true
          ls -lh build/
          echo "=== LOG TAIL ==="
          tail -n 200 build/webview-build.log || true
          git config user.email "bot@arena.ai"
          git config user.name "arena bot"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/anrandaniel2/Minecraft.git
          git status
          git pull --rebase origin arena/01a0bb79-minecraft || echo "pull failed"
          git add build/webview-build.log build/gist-webview.json || true
          git commit -m "WebView build log $(date -u) [skip ci]" || echo "commit failed"
          git push origin arena/01a0bb79-minecraft || echo "push failed"

      - name: Upload WebView APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-webview-apk
          path: |
            android-webview/app/build/outputs/apk/debug/*.apk
            webview-build.log
            gist.json
          if-no-files-found: warn

  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and tools
        run: |
          sdkmanager --install "ndk;25.1.8937393" "build-tools;34.0.0" "platforms;android-34" "platform-tools" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat local.properties

      - name: Create keystore and icons
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android/app
          cp debug.keystore android/app/debug.keystore
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for base in ["android/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          PY

      - name: Build Native APK
        run: |
          cd android
          gradle --version
          gradle assembleDebug --stacktrace 2>&1 | tee ../native-build.log || true
          tail -n 300 ../native-build.log || true
          ls -lh app/build/outputs/apk/debug/ || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Trying wrapper"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace 2>&1 | tee -a ../native-build.log || true
            tail -n 300 ../native-build.log || true
          fi

      - name: Create gist with native log
        if: always()
        run: |
          if [ -f native-build.log ]; then
            head -c 900000 native-build.log > /tmp/log.txt
            CONTENT=$(cat /tmp/log.txt | jq -Rs .)
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/gists -d "{\"public\": true, \"files\": {\"native-build.log\": {\"content\": $CONTENT}}}" | tee gist-native.json
            cat gist-native.json | jq -r '.html_url' || true
          fi

      - name: Upload logs
        if: always()
        run: |
          mkdir -p build
          cp native-build.log build/native-build.log || true
          cp gist-native.json build/gist-native.json || true
          git config user.email "bot@arena.ai"
          git config user.name "arena bot"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/anrandaniel2/Minecraft.git
          git pull --rebase origin arena/01a0bb79-minecraft || true
          git add build/native-build.log build/gist-native.json || true
          git commit -m "Native build log $(date -u) [skip ci]" || true
          git push origin arena/01a0bb79-minecraft || true

      - name: Upload Native APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-native-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            native-build.log
            gist-native.json
          if-no-files-found: warn

  combine:
    runs-on: ubuntu-latest
    needs: [build-webview-apk, build-native-apk]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine and rename
        run: |
          mkdir -p build
          find artifacts -name "*.apk" -type f -exec cp {} build/ \; || true
          ls -lh build/ || true
          cd build
          if ls *.apk 1> /dev/null 2>&1; then
            largest=$(ls -S *.apk | head -n 1)
            cp "$largest" Eaglercraft26-Android.apk
            echo "APKs built:" > apk-info.txt
            ls -lh *.apk >> apk-info.txt
            cat apk-info.txt
          else
            echo "No APKs found" > apk-info.txt
            find ../artifacts -type f | head -n 100 >> apk-info.txt
            cat apk-info.txt
          fi
          ls -lh

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-final-apk
          path: |
            build/*.apk
            build/*.txt
          if-no-files-found: warn
