name: Build Android APK - Eaglercraft 26.2 Native

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bb79-minecraft

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  build-webview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > android-webview/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat local.properties
          ls -R android-webview | head -n 100

      - name: Create debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android-webview/app
          cp debug.keystore android-webview/app/debug.keystore

      - name: Create icons
        run: |
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for base in ["android-webview/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          PY

      - name: Prepare WebView assets
        run: |
          mkdir -p android-webview/app/src/main/assets
          cat > android-webview/app/src/main/assets/eaglercraft-26.2-0.6.html <<'HTML'
          <!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://eymenwsmc.site/262/index.html"></head><body>Redirecting to Eaglercraft 26.2...</body></html>
          HTML

      - name: Build WebView APK
        run: |
          cd android-webview
          echo "=== gradle version ==="
          gradle --version
          echo "=== build ==="
          gradle assembleDebug --stacktrace --info 2>&1 | tee ../webview-build.log || true
          echo "=== tail ==="
          tail -n 1000 ../webview-build.log || true
          ls -lh app/build/outputs/apk/debug/ || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Trying wrapper"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --info 2>&1 | tee -a ../webview-build.log || true
            tail -n 1000 ../webview-build.log || true
            ls -lh app/build/outputs/apk/debug/ || true
          fi

      - name: Upload log via contents API with verbose
        if: always()
        run: |
          set -x
          ls -lh webview-build.log || true
          if [ -f webview-build.log ]; then
            echo "File exists size $(wc -c < webview-build.log)"
            # Try to get existing file sha
            curl -s -v -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/anrandaniel2/Minecraft/contents/build/webview-build.log?ref=arena/01a0bb79-minecraft -o /tmp/get.json 2>&1 | head -n 50
            cat /tmp/get.json | head -n 20
            SHA=$(cat /tmp/get.json | jq -r '.sha // empty' || true)
            echo "SHA=$SHA"
            B64=$(base64 -w 0 webview-build.log)
            echo "B64 length ${#B64}"
            if [ -z "$SHA" ]; then
              JSON=$(jq -n --arg content "$B64" --arg msg "Add webview build log via API $(date -u)" '{message:$msg, content:$content, branch:"arena/01a0bb79-minecraft"}')
            else
              JSON=$(jq -n --arg content "$B64" --arg msg "Update webview build log via API $(date -u)" --arg sha "$SHA" '{message:$msg, content:$content, branch:"arena/01a0bb79-minecraft", sha:$sha}')
            fi
            echo "JSON size ${#JSON}"
            curl -s -v -X PUT -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/anrandaniel2/Minecraft/contents/build/webview-build.log -d "$JSON" -o /tmp/put.json 2>&1 | head -n 100
            cat /tmp/put.json | head -n 100
          fi

      - name: Commit log via git push
        if: always()
        run: |
          set -x
          mkdir -p build
          cp webview-build.log build/webview-build.log || true
          ls -lh build/
          git config user.email "bot@arena.ai"
          git config user.name "arena bot"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/anrandaniel2/Minecraft.git
          git status
          git add build/webview-build.log || true
          git commit -m "WebView log via git $(date -u) [skip ci]" || true
          git push origin arena/01a0bb79-minecraft || true

      - name: Create issue with log
        if: always()
        run: |
          set -x
          if [ -f webview-build.log ]; then
            head -c 50000 webview-build.log > /tmp/body.txt
            echo -e "\n\n--- tail ---\n" >> /tmp/body.txt
            tail -n 100 webview-build.log >> /tmp/body.txt
            # Escape for JSON
            BODY=$(cat /tmp/body.txt | jq -Rs .)
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/anrandaniel2/Minecraft/issues -d "{\"title\":\"WebView build log $GITHUB_RUN_ID\",\"body\":$BODY}" -o /tmp/issue.json
            cat /tmp/issue.json | head -n 50
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-webview-apk
          path: |
            android-webview/app/build/outputs/apk/debug/*.apk
            webview-build.log
          if-no-files-found: warn

  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and cmake
        run: |
          sdkmanager --install "ndk;25.1.8937393" "build-tools;34.0.0" "platforms;android-34" "platform-tools" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat local.properties

      - name: Create keystore and icons
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android/app
          cp debug.keystore android/app/debug.keystore
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for base in ["android/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          PY

      - name: Build Native Vulkan APK
        run: |
          cd android
          gradle --version
          gradle assembleDebug --stacktrace 2>&1 | tee ../native-build.log || true
          tail -n 1000 ../native-build.log || true
          ls -lh app/build/outputs/apk/debug/ || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace 2>&1 | tee -a ../native-build.log || true
            tail -n 1000 ../native-build.log || true
          fi

      - name: Upload native log via contents API
        if: always()
        run: |
          set -x
          ls -lh native-build.log || true
          if [ -f native-build.log ]; then
            curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/anrandaniel2/Minecraft/contents/build/native-build.log?ref=arena/01a0bb79-minecraft -o /tmp/get.json || true
            SHA=$(cat /tmp/get.json | jq -r '.sha // empty' || true)
            B64=$(base64 -w 0 native-build.log)
            if [ -z "$SHA" ]; then
              JSON=$(jq -n --arg content "$B64" --arg msg "Add native log $(date -u)" '{message:$msg, content:$content, branch:"arena/01a0bb79-minecraft"}')
            else
              JSON=$(jq -n --arg content "$B64" --arg msg "Update native log $(date -u)" --arg sha "$SHA" '{message:$msg, content:$content, branch:"arena/01a0bb79-minecraft", sha:$sha}')
            fi
            curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/anrandaniel2/Minecraft/contents/build/native-build.log -d "$JSON" -o /tmp/put.json || true
            cat /tmp/put.json | head -n 100
          fi

      - name: Commit native log via git
        if: always()
        run: |
          set -x
          mkdir -p build
          cp native-build.log build/native-build.log || true
          git config user.email "bot@arena.ai"
          git config user.name "arena bot"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/anrandaniel2/Minecraft.git
          git add build/native-build.log || true
          git commit -m "Native log via git $(date -u) [skip ci]" || true
          git push origin arena/01a0bb79-minecraft || true

      - name: Upload Native APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-native-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            native-build.log
          if-no-files-found: warn

  combine:
    runs-on: ubuntu-latest
    needs: [build-webview-apk, build-native-apk]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine
        run: |
          mkdir -p build
          find artifacts -name "*.apk" -type f -exec cp {} build/ \; || true
          ls -lh build/ || true
          cd build
          if ls *.apk 1> /dev/null 2>&1; then
            largest=$(ls -S *.apk | head -n 1)
            cp "$largest" Eaglercraft26-Android.apk
            ls -lh *.apk > apk-info.txt
            cat apk-info.txt
          else
            echo "No APKs" > apk-info.txt
            find ../artifacts -type f | head -n 100 >> apk-info.txt
            cat apk-info.txt
          fi

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-final-apk
          path: |
            build/*.apk
            build/*.txt
          if-no-files-found: warn
