name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build a release (signed with RELEASE_KEYSTORE secrets if present)"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.5"
  GODOT_RELEASE: "stable"
  NDK_VERSION: "28.1.13356709"
  JAVA_VERSION: "17"

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compile the C++ GDExtension for every Android ABI in parallel.
  # ---------------------------------------------------------------------------
  native:
    name: Native (${{ matrix.platform }}-${{ matrix.arch }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android]
        arch: [arm64, arm32]
        target: [template_release, template_debug]
        include:
          # Editor-host library: headless Godot on the CI runner must be able to
          # load the extension while exporting, otherwise the EaglerHost node in
          # main.tscn is serialised as a missing class.
          - platform: linux
            arch: x86_64
            target: template_debug
          - platform: linux
            arch: x86_64
            target: template_release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install scons==4.8.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;${{ env.NDK_VERSION }} platform-tools"

      - name: Cache SCons objects
        uses: actions/cache@v4
        with:
          # Only the godot-cpp bindings are cached (they depend solely on the
          # API json / build profile). Our own objects are NEVER cached: a
          # restored stale src/*.o linked against fresh headers produced a
          # library that crashed in its static initialisers on device.
          path: |
            godot-cpp/bin
            godot-cpp/gen
            godot-cpp/src/**/*.o
            godot-cpp/src/**/*.os
          key: scons-v2-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ hashFiles('godot-cpp/gdextension/extension_api.json', 'build_profile.json', 'godot-cpp/SConstruct', 'godot-cpp/tools/**') }}

      - name: Build libeaglerhost
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          rm -f src/*.o src/*.os thirdparty/brotli/c/*/*.o thirdparty/brotli/c/*/*.os bin/${{ matrix.platform }}/*.so .sconsign.dblite
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ matrix.target }} \
                ndk_version=${{ env.NDK_VERSION }} android_api_level=24 \
                build_profile=build_profile.json -j$(nproc)
          ls -la bin/${{ matrix.platform }}
          # Sanity: the library must contain the classes registered in register_types.cpp.
          for cls in $(grep -oP 'GDREGISTER_CLASS\(\K[A-Za-z_]+' src/register_types.cpp); do
            strings bin/${{ matrix.platform }}/*.so | grep -q "$cls" || { echo "::error::$cls missing from built library (stale objects?)"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: bin/${{ matrix.platform }}/*.so
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Unit-test the pure C++ HTTP server on the host.
  # ---------------------------------------------------------------------------
  test-http-server:
    name: Test native components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: LocalHttpServer
        run: |
          mkdir -p /tmp/www && echo "<html>ok</html>" > /tmp/www/index.html
          g++ -std=c++17 -O2 -pthread -Isrc tests/http_server_test.cpp src/local_http_server.cpp -o /tmp/http_test
          /tmp/http_test /tmp/www
      - name: BundleUnpacker (real bundle)
        run: |
          g++ -std=c++17 -O2 -pthread -Isrc -Ithirdparty/brotli/c/include tests/bundle_unpacker_test.cpp \
              src/bundle_unpacker.cpp thirdparty/brotli/c/dec/*.c thirdparty/brotli/c/common/*.c -o /tmp/unpack_test
          /tmp/unpack_test web/eaglercraft.html /tmp/unpacked
          ls -la /tmp/unpacked

  # ---------------------------------------------------------------------------
  # 2b. Commit the built libraries back to the branch so that a plain checkout
  #     (desktop editor, Android editor one-click run) can export without an NDK.
  # ---------------------------------------------------------------------------
  commit-libs:
    name: Commit prebuilt libraries
    needs: [native, apk]   # after apk so the two commit-back steps never race
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-android-*
          merge-multiple: true
          path: bin/android
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          merge-multiple: true
          path: bin/linux
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bin/android/*.so bin/linux/*.so
          if git diff --cached --quiet; then echo "libraries unchanged"; exit 0; fi
          git commit -m "ci: update prebuilt GDExtension libraries [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

  # ---------------------------------------------------------------------------
  # 3. Export the APK with headless Godot (Gradle build so we can patch the
  #    manifest for the WebView).
  # ---------------------------------------------------------------------------
  apk:
    name: Export APK
    needs: [native, test-http-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          pattern: native-android-*
          merge-multiple: true
          path: bin/android

      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          merge-multiple: true
          path: bin/linux

      - name: Show native libs
        run: ls -la bin/android bin/linux

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 cmdline-tools;latest"

      - name: Accept SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Check bundle
        run: |
          test -f web/eaglercraft.html || { echo "::error::web/eaglercraft.html missing – run the 'Fetch EaglerCraft bundle' workflow"; exit 1; }
          ls -la web/eaglercraft.html
          # Offline guarantee: the bundle must not reference any remote host.
          if grep -oE '"(https?|wss?)://[^"]+' web/eaglercraft.html | grep -vE 'w3.org|127.0.0.1|localhost' ; then
            echo "::warning::bundle references remote URLs (listed above)"; fi

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot && cd ~/godot
          curl -fL --retry 3 -o godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          curl -fL --retry 3 -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q godot.zip && mv Godot_v${V}_linux.x86_64 godot && chmod +x godot
          unzip -q templates.tpz

      - name: Install export templates
        run: |
          V="${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p ~/.local/share/godot/export_templates/${V}
          cp -r ~/godot/templates/* ~/.local/share/godot/export_templates/${V}/
          ls ~/.local/share/godot/export_templates/${V} | head

      - name: Install Android build template (Gradle project)
        run: |
          V="${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${V}/android_source.zip -d android/build
          echo "${V}" > android/.build_version
          touch android/build/.gdignore

      - name: Patch Gradle template for the WebView host
        run: |
          set -e
          # Godot regenerates android/build/AndroidManifest.xml on every export,
          # so we cannot edit it directly. Instead we (1) drop a network security
          # config that only whitelists cleartext HTTP to the loopback address
          # used by the in-process server, and (2) hook the Gradle manifest
          # tasks to inject the attributes into the *merged* manifest.
          mkdir -p android/build/res/xml
          cat > android/build/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <!-- Offline policy: no trust anchors => every remote HTTPS
                   connection fails TLS validation; cleartext is refused
                   everywhere except the in-process loopback server. -->
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors />
              </base-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
              <!-- In-app updater: GitHub Releases only, HTTPS with system CAs. -->
              <domain-config cleartextTrafficPermitted="false">
                  <domain includeSubdomains="false">api.github.com</domain>
                  <domain includeSubdomains="false">github.com</domain>
                  <domain includeSubdomains="true">githubusercontent.com</domain>
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </domain-config>
          </network-security-config>
          XML
          cat >> android/build/build.gradle <<'GRADLE'

          // --- EaglerHost: WebView requirements (injected by CI) -------------------
          tasks.matching { it.name ==~ /process.*Manifest.*/ }.configureEach { t ->
              t.doLast {
                  def patch = { File f ->
                      if (f.name == 'AndroidManifest.xml' && f.text.contains('<application')) {
                          def txt = f.text
                          if (!txt.contains('android:networkSecurityConfig')) {
                              txt = txt.replaceFirst('<application', '<application android:networkSecurityConfig="@xml/network_security_config"')
                          }
                          if (!txt.contains('android:hardwareAccelerated')) {
                              txt = txt.replaceFirst('<application', '<application android:hardwareAccelerated="true"')
                          }
                          if (!txt.contains('android:largeHeap')) {
                              txt = txt.replaceFirst('<application', '<application android:largeHeap="true"')
                          }
                          f.text = txt
                          println "EaglerHost: patched ${f}"
                      }
                  }
                  t.outputs.files.each { File out ->
                      if (out.isDirectory()) { out.eachFileRecurse { patch(it) } } else if (out.exists()) { patch(out) }
                  }
              }
          }
          GRADLE
          tail -n 30 android/build/build.gradle

      - name: Stamp version
        id: ver
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            # Purely numeric 4th segment so the in-app version compare orders nightlies.
            NAME="$(grep -oP 'config/version="\K[^"]+' project.godot).${GITHUB_RUN_NUMBER}"
          fi
          # versionCode must increase monotonically: seconds since 2024 / 60 fits in int32 until 2106.
          CODE=$(( ( $(date +%s) - 1704067200 ) / 60 ))
          sed -i "s|^version/name=.*|version/name=\"$NAME\"|; s|^version/code=.*|version/code=$CODE|" export_presets.cfg
          sed -i "s|^config/version=.*|config/version=\"$NAME\"|" project.godot
          echo "name=$NAME" >> $GITHUB_OUTPUT; echo "code=$CODE" >> $GITHUB_OUTPUT
          grep -n "version/" export_presets.cfg

      - name: Prepare keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_USER: ${{ secrets.RELEASE_KEYSTORE_USER }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -e
          # Debug keystore (always).
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV
          # Release keystore. Android only installs an update if it is signed
          # with the SAME key as the installed build, so this must be stable:
          #   * preferred: RELEASE_KEYSTORE_BASE64/_USER/_PASSWORD secrets
          #   * fallback : a keystore committed in ci/release.keystore (dev key;
          #                fine for side-loaded builds, NOT for a store).
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
            USER="$RELEASE_KEYSTORE_USER"; PASS="$RELEASE_KEYSTORE_PASSWORD"
          else
            if [ ! -f ci/release.keystore ]; then
              # First run: create the dev key and commit it so all later builds share it.
              mkdir -p ci
              keytool -genkeypair -v -keystore ci/release.keystore -storepass eaglerhost-dev -keypass eaglerhost-dev \
                -alias eaglerhost -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=EaglerCraft Godot Host Dev,O=EaglerHost,C=CA" >/dev/null 2>&1
              echo "new_keystore=true" >> $GITHUB_OUTPUT
            fi
            cp ci/release.keystore "$HOME/release.keystore"
            USER="eaglerhost"; PASS="eaglerhost-dev"
            echo "::notice::Using the dev release key (ci/release.keystore). Set RELEASE_KEYSTORE_* secrets for a private key."
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$USER" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "has_release=true" >> $GITHUB_OUTPUT

      - name: Configure Godot editor settings (Android SDK / Java paths)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat ~/.config/godot/editor_settings-4.5.tres

      - name: Import project (headless)
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log | tail -n 40 || true
          if grep -q "GDExtension dynamic library not found" import.log; then
            echo "::error::editor-host extension library failed to load"; exit 1; fi

      - name: Export APK
        env:
          VER: ${{ steps.ver.outputs.name }}
        run: |
          set -o pipefail
          mkdir -p export
          # Always a *release* export signed with the stable key so every build
          # can update over the previous one.
          ~/godot/godot --headless --path . --export-release "Android" "export/EaglerCraft-${VER}.apk" 2>&1 | tee export.log
          ls -la export
          test -n "$(ls export/*.apk 2>/dev/null)" || { echo "::error::No APK produced"; exit 1; }
          if grep -q "Cannot get class 'EaglerHost'" export.log; then
            echo "::error::EaglerHost class was not available during export (extension not loaded)"; exit 1; fi

      - name: Verify APK contents (native libs, bundle, permissions)
        run: |
          APK=$(ls export/*.apk | head -n1)
          AAPT=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/aapt | tail -n1)
          # INTERNET is required by Android even for 127.0.0.1 sockets; anything
          # beyond INTERNET/WAKE_LOCK/VIBRATE is an error.
          $AAPT dump permissions "$APK" | tee perms.txt
          if grep -E "uses-permission" perms.txt | grep -vE "INTERNET|WAKE_LOCK|VIBRATE|ACCESS_NETWORK_STATE|REQUEST_INSTALL_PACKAGES"; then
            echo "::error::unexpected permission requested"; exit 1; fi
          unzip -l "$APK" | grep -q "eaglercraft.html" || { echo "::error::bundle missing from APK"; exit 1; }
          unzip -l "$APK" | grep -E "libeaglerhost|libgodot_android|AndroidManifest" || true
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libeaglerhost" || { echo "::error::arm64 native lib missing from APK"; exit 1; }
          # The .so must NOT also be inside the PCK: if Godot finds it as a
          # resource it tries to dlopen from the pack and fails on device.
          if unzip -l "$APK" | grep -E "assets/.*libeaglerhost.*\.so" ; then
            echo "::error::native library was packed as an asset (include_filter too broad)"; exit 1; fi
          unzip -o -q "$APK" "assets/*.pck" -d /tmp/apkassets 2>/dev/null || true
          if ls /tmp/apkassets/assets/*.pck >/dev/null 2>&1 && strings /tmp/apkassets/assets/*.pck | grep -qE "^res://bin/android/libeaglerhost.*\.so$"; then
            echo "::error::native library was packed into the PCK (include_filter too broad)"; exit 1; fi
          unzip -l "$APK" | grep -E "lib/.*libeaglerhost|assets/.*(pck|gdextension)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: EaglerCraft-apk
          path: |
            export/*.apk
            export/*.apk.sha256
            export.log
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated dev keystore
        if: steps.keystore.outputs.new_keystore == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash -u -q || true   # drop version-stamp edits, keep only the keystore
          git stash pop -q 2>/dev/null || true
          git checkout -- export_presets.cfg project.godot 2>/dev/null || true
          git add -f ci/release.keystore
          git commit -m "ci: add dev release keystore (stable update signature) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break
            sleep 5
          done

      - name: Checksum
        run: |
          cd export && for f in *.apk; do sha256sum "$f" > "$f.sha256"; done && cat *.sha256

      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            export/*.apk
            export/*.apk.sha256
          generate_release_notes: true

      - name: Publish rolling pre-release (branch push)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly ${{ steps.ver.outputs.name }}
          prerelease: true
          body: |
            Automatic build of `${{ github.sha }}` from `${{ github.ref_name }}`.
            The in-app updater with `allow_prerelease = true` will pick this up.
          files: |
            export/*.apk
            export/*.apk.sha256
