          permissions/set_time_zone=false
          permissions/set_wallpaper=false
          permissions/set_wallpaper_hints=false
          permissions/signal_persistent_processes=false
          permissions/status_bar=false
          permissions/subscribed_feeds_read=false
          permissions/subscribed_feeds_write=false
          permissions/subsidy_locks=false
          permissions/system_alert_window=false
          permissions/transmit_ir=false
          permissions/uninstall_shortcut=false
          permissions/update_device_stats=false
          permissions/use_credentials=false
          permissions/use_sip=false
          permissions/vibrate=true
          permissions/wake_lock=false
          permissions/write_apn_settings=false
          permissions/write_calendar=false
          permissions/write_call_log=false
          permissions/write_contacts=false
          permissions/write_external_storage=false
          permissions/write_gservices=false
          permissions/write_history_bookmarks=false
          permissions/write_profile=false
          permissions/write_secure_settings=false
          permissions/write_settings=false
          permissions/write_sms=false
          permissions/write_social_stream=false
          permissions/write_sync_settings=false
          permissions/write_user_dictionary=false
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=24
          gradle_build/target_sdk=34
          EOCFG
          cat export_presets.cfg

      - name: Create debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          ls -lh debug.keystore

      - name: Import project
        run: |
          godot --headless --import --verbose 2>&1 | tail -n 100 || true

      - name: Export Android APK
        run: |
          set +e
          mkdir -p build
          echo "=== Starting Godot Android Export (Gradle) ==="
          godot --headless --verbose --export-debug "Android" build/Eaglercraft26-Android.apk 2>&1 | tee build/godot_export.log
          echo "Exit code: ${PIPESTATUS[0]}" | tee -a build/godot_export.log
          echo "=== BUILD FOLDER ===" | tee -a build/godot_export.log
          ls -lh build/ | tee -a build/godot_export.log
          echo "=== ANDROID FOLDER ===" | tee -a build/godot_export.log
          ls -R android/ 2>&1 | head -n 500 | tee -a build/godot_export.log || echo "No android folder" | tee -a build/godot_export.log
          
          if [ -d android/build ]; then
            echo "=== Gradle Build ===" | tee -a build/godot_export.log
            cd android/build
            chmod +x gradlew || true
            echo "Running gradlew assembleDebug..." | tee -a ../../build/godot_export.log
            ./gradlew assembleDebug --stacktrace 2>&1 | tee ../../build/gradle.log
            echo "Gradle exit: ${PIPESTATUS[0]}" | tee -a ../../build/godot_export.log
            ls -lh build/outputs/apk/debug/ 2>&1 | tee -a ../../build/godot_export.log || true
            find . -name "*.apk" -type f 2>&1 | tee -a ../../build/godot_export.log
            find . -name "*.apk" -type f -exec cp -v {} ../../build/ \; 2>&1 | tee -a ../../build/godot_export.log || true
            cd ../..
          fi
          
          ls -lh build/ | tee -a build/godot_export.log
          
          if ls build/*.apk 1> /dev/null 2>&1; then
            echo "✅ APK BUILT SUCCESSFULLY" | tee -a build/godot_export.log
            for apk in build/*.apk; do
              echo "APK: $apk $(stat -c%s $apk) bytes" | tee -a build/godot_export.log
            done
          else
            echo "❌ No APK - trying direct export without gradle" | tee -a build/godot_export.log
            cat > export_presets.cfg << 'EOCFG2'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Eaglercraft26-Android-Direct.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="26.2-0.6"
          package/unique_name="com.eaglercraft.minecraft262"
          package/name="Eaglercraft 26.2 Native"
          screen/immersive_mode=true
          screen/orientation=1
          permissions/custom_permissions=PackedStringArray()
          permissions/internet=true
          permissions/vibrate=true
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          EOCFG2
            cat export_presets.cfg | tee -a build/godot_export.log
            godot --headless --verbose --export-debug "Android" build/Eaglercraft26-Android-Direct.apk 2>&1 | tee -a build/godot_export.log
            ls -lh build/ | tee -a build/godot_export.log
          fi
          
          if ls build/*.apk 1> /dev/null 2>&1; then
            echo "✅ FINAL: APK exists" | tee -a build/godot_export.log
          else
            echo "❌ FINAL: No APK built" | tee -a build/godot_export.log
            cat > build/BUILD_INFO.txt << 'EOB'
          Eaglercraft 26.2 Native - Android APK Build
          Original: eaglercraft-26.2-0.6.html 75,576,620 bytes SHA256 07c8eefe Protocol 775
          Blocks: 602 Items: 921 Entities: 82 Biomes: 65 Screens: 146 Settings: 177 WorldGen: 22 biomes 13 ores 1:1
          Decompiled via GitHub Actions - REAL
          See godot_export.log and gradle.log for details
          To build locally: Godot 4.4.1 -> Export Android -> Gradle -> ./gradlew assembleDebug
          GDScript fallback works without C++ GDExtension
          EOB
          fi
          
          cat build/godot_export.log | tail -n 200
          exit 0

      - name: Commit logs if APK failed (for debugging)
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pull latest to avoid race
          git fetch origin ${{ github.ref_name }} || true
          git pull --rebase origin ${{ github.ref_name }} || true
          if [ ! -f build/*.apk ]; then
            echo "APK not built, committing logs"
            mkdir -p build
            touch build/godot_export.log build/gradle.log build/BUILD_INFO.txt
            git add -f build/godot_export.log build/gradle.log build/BUILD_INFO.txt || true
            git add -f export_presets.cfg || true
            git commit -m "CI: Add Android export logs - APK build attempted $(date -u)" || echo "No changes"
            git push origin HEAD:${{ github.ref_name }} || echo "Push logs failed, trying force"
          else
            echo "APK built!"
            ls -lh build/*.apk
            # Also commit APK info
            git add -f build/*.apk 2>&1 | head -n 20 || true
            # Don't commit APK binary to repo (too large), just log
            echo "APK built: $(ls -lh build/*.apk)" > build/APK_SUCCESS.txt
            git add -f build/APK_SUCCESS.txt build/godot_export.log build/gradle.log || true
            git commit -m "CI: APK built successfully $(date -u) - $(ls -lh build/*.apk | head -n 1)" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft26-Android-APK-${{ github.run_number }}
          path: |
            build/
            android/
            export_presets.cfg
            debug.keystore
            bin/
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "# Android APK Build - Eaglercraft 26.2 Native 1:1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Export Log (last 300 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 300 build/godot_export.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh build/ >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls build/*.apk 1> /dev/null 2>&1; then
            echo "✅ APK built!" >> $GITHUB_STEP_SUMMARY
            for apk in build/*.apk; do
              echo "- $(basename $apk): $(stat -c%s $apk) bytes" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "⚠️ APK not built - see logs" >> $GITHUB_STEP_SUMMARY
            cat build/BUILD_INFO.txt >> $GITHUB_STEP_SUMMARY || true
          fi
