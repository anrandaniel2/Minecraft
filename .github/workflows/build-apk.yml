name: Build Android APK - Eaglercraft 26.2 Native

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bb79-minecraft

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  build-webview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > android-webview/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Create debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android-webview/app
          cp debug.keystore android-webview/app/debug.keystore

      - name: Create icons
        run: |
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for base in ["android-webview/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          PY

      - name: Prepare WebView assets
        run: |
          mkdir -p android-webview/app/src/main/assets
          cat > android-webview/app/src/main/assets/eaglercraft-26.2-0.6.html <<'HTML'
          <!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://eymenwsmc.site/262/index.html"></head><body>Redirecting to Eaglercraft 26.2...</body></html>
          HTML

      - name: Build WebView APK
        run: |
          cd android-webview
          gradle assembleDebug --stacktrace --info 2>&1 | tee ../webview-build.log || true
          tail -n 500 ../webview-build.log || true
          ls -lh app/build/outputs/apk/debug/ || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --info 2>&1 | tee -a ../webview-build.log || true
            tail -n 1000 ../webview-build.log || true
          fi

      - name: Post log as issue comment via API
        if: always()
        run: |
          if [ -f webview-build.log ]; then
            echo "Posting log to issue"
            # Create a new issue with log truncated
            head -c 60000 webview-build.log > /tmp/body.txt
            echo -e "\n\nFull log tail:\n" >> /tmp/body.txt
            tail -n 200 webview-build.log >> /tmp/body.txt
            # Try to create issue
            gh issue create --title "WebView build log $(date -u) run $GITHUB_RUN_ID" --body-file /tmp/body.txt 2>&1 | tee issue.json || true
            cat issue.json || true
            # Also try API directly
            CONTENT=$(cat webview-build.log | head -c 50000 | jq -Rs .)
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/anrandaniel2/Minecraft/issues -d "{\"title\":\"WebView log $GITHUB_RUN_ID\",\"body\":$CONTENT}" | tee issue-api.json || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload log via Contents API (retry)
        if: always()
        run: |
          if [ -f webview-build.log ]; then
            echo "Trying contents API"
            # get sha
            RESP=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/anrandaniel2/Minecraft/contents/build/webview-build.log?ref=arena/01a0bb79-minecraft || true)
            echo "$RESP" | head -n 20
            SHA=$(echo "$RESP" | jq -r '.sha // empty' || true)
            echo "SHA $SHA"
            B64=$(base64 -w 0 webview-build.log)
            if [ -z "$SHA" ]; then
              JSON=$(jq -n --arg content "$B64" --arg msg "Add webview log" '{message:$msg, content:$content, branch:"arena/01a0bb79-minecraft"}')
            else
              JSON=$(jq -n --arg content "$B64" --arg msg "Update webview log" --arg sha "$SHA" '{message:$msg, content:$content, branch:"arena/01a0bb79-minecraft", sha:$sha}')
            fi
            curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/anrandaniel2/Minecraft/contents/build/webview-build.log -d "$JSON" | tee put.json
            cat put.json
          fi

      - name: Upload WebView APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-webview-apk
          path: |
            android-webview/app/build/outputs/apk/debug/*.apk
            webview-build.log
            issue.json
            issue-api.json
            put.json
          if-no-files-found: warn

  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393" "build-tools;34.0.0" "platforms;android-34" "platform-tools" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Create keystore and icons
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android/app
          cp debug.keystore android/app/debug.keystore
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for base in ["android/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          PY

      - name: Build Native APK
        run: |
          cd android
          gradle assembleDebug --stacktrace 2>&1 | tee ../native-build.log || true
          tail -n 500 ../native-build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace 2>&1 | tee -a ../native-build.log || true
            tail -n 1000 ../native-build.log || true
          fi

      - name: Post native log as issue
        if: always()
        run: |
          if [ -f native-build.log ]; then
            head -c 60000 native-build.log > /tmp/body.txt
            gh issue create --title "Native build log $(date -u) run $GITHUB_RUN_ID" --body-file /tmp/body.txt 2>&1 | tee issue.json || true
            cat issue.json || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Native APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-native-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            native-build.log
          if-no-files-found: warn

  combine:
    runs-on: ubuntu-latest
    needs: [build-webview-apk, build-native-apk]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine
        run: |
          mkdir -p build
          find artifacts -name "*.apk" -type f -exec cp {} build/ \; || true
          ls -lh build/ || true
          cd build
          if ls *.apk 1> /dev/null 2>&1; then
            largest=$(ls -S *.apk | head -n 1)
            cp "$largest" Eaglercraft26-Android.apk
            ls -lh *.apk > apk-info.txt
            cat apk-info.txt
          else
            echo "No APKs" > apk-info.txt
            find ../artifacts -type f | head -n 100 >> apk-info.txt
            cat apk-info.txt
          fi

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-final-apk
          path: |
            build/*.apk
            build/*.txt
          if-no-files-found: warn
