name: Build Android APK - Eaglercraft 26.2 Native

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bb79-minecraft

permissions:
  contents: write
  actions: read

jobs:
  build-webview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        if: always()
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lh $ANDROID_HOME || true
          sdkmanager --list | head -n 100 || true
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools" 2>&1 | tee -a /tmp/sdkmanager.log || true
          cat /tmp/sdkmanager.log | tail -n 100 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > android-webview/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat local.properties

      - name: Create debug keystore
        if: always()
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android-webview/app
          cp debug.keystore android-webview/app/debug.keystore
          ls -lh android-webview/app/debug.keystore || true

      - name: Create icons
        if: always()
        run: |
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for base in ["android-webview/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          print("Icons created")
          PY

      - name: Prepare WebView assets
        if: always()
        run: |
          mkdir -p android-webview/app/src/main/assets
          cat > android-webview/app/src/main/assets/eaglercraft-26.2-0.6.html <<'HTML'
          <!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://eymenwsmc.site/262/index.html"></head><body>Redirecting to Eaglercraft 26.2...</body></html>
          HTML
          ls -lh android-webview/app/src/main/assets/

      - name: Build WebView APK
        if: always()
        run: |
          set -x
          cd android-webview
          echo "=== PWD $(pwd) ==="
          ls -lh
          echo "=== gradle version ==="
          which gradle || true
          gradle --version 2>&1 | tee ../webview-build.log || true
          echo "=== ls ==="
          ls -lh ../webview-build.log || true
          echo "=== build ==="
          gradle assembleDebug --stacktrace --info 2>&1 | tee -a ../webview-build.log || true
          echo "=== TAIL ==="
          tail -n 1000 ../webview-build.log || true
          ls -lh app/build/outputs/apk/debug/ || true
          find . -name "*.apk" -type f -exec ls -lh {} \; || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Trying wrapper"
            chmod +x gradlew || true
            ls -lh gradlew || true
            ./gradlew assembleDebug --stacktrace --info 2>&1 | tee -a ../webview-build.log || true
            tail -n 1000 ../webview-build.log || true
            ls -lh app/build/outputs/apk/debug/ || true
          fi

      - name: Commit logs
        if: always()
        run: |
          set -x
          mkdir -p build
          ls -lh webview-build.log || true
          ls -lh /tmp/sdkmanager.log || true
          cat /tmp/sdkmanager.log | tail -n 200 || true
          # Combine logs
          cat /tmp/sdkmanager.log > build/webview-build.log 2>/dev/null || true
          echo -e "\n\n=== WEBVIEW BUILD LOG ===\n" >> build/webview-build.log
          cat webview-build.log >> build/webview-build.log 2>/dev/null || echo "no webview log" >> build/webview-build.log
          ls -lh build/
          git config user.email "bot@arena.ai"
          git config user.name "arena bot"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/anrandaniel2/Minecraft.git
          git fetch origin arena/01a0bb79-minecraft
          git pull --rebase origin arena/01a0bb79-minecraft || true
          git add build/webview-build.log || true
          git commit -m "WebView log $(date -u) [skip ci]" || true
          git push origin arena/01a0bb79-minecraft || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-webview-apk
          path: |
            android-webview/app/build/outputs/apk/debug/*.apk
            webview-build.log
            build/webview-build.log
          if-no-files-found: warn

  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-webview-apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and cmake
        if: always()
        run: |
          set -x
          sdkmanager --install "ndk;25.1.8937393" "build-tools;34.0.0" "platforms;android-34" "platform-tools" "cmake;3.22.1" 2>&1 | tee /tmp/sdkmanager-native.log || true
          cat /tmp/sdkmanager-native.log | tail -n 200 || true
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat local.properties

      - name: Create keystore and icons
        if: always()
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p android/app
          cp debug.keystore android/app/debug.keystore
          pip install Pillow -q
          python3 <<'PY'
          from PIL import Image
          import os
          img = Image.new('RGBA', (512,512), (61,220,132,255))
          for x in range(128,384):
              for y in range(128,384):
                  img.putpixel((x,y), (255,255,255,255))
          for base in ["android/app/src/main/res"]:
              for size, folder in [(72,"hdpi"), (48,"mdpi"), (96,"xhdpi"), (144,"xxhdpi"), (192,"xxxhdpi")]:
                  os.makedirs(f"{base}/mipmap-{folder}", exist_ok=True)
                  resized = img.resize((size,size))
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher.png")
                  resized.save(f"{base}/mipmap-{folder}/ic_launcher_round.png")
          PY

      - name: Build Native Vulkan APK
        if: always()
        run: |
          set -x
          cd android
          gradle --version 2>&1 | tee ../native-build.log || true
          gradle assembleDebug --stacktrace 2>&1 | tee -a ../native-build.log || true
          tail -n 1000 ../native-build.log || true
          ls -lh app/build/outputs/apk/debug/ || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            chmod +x gradlew || true
            ./gradlew assembleDebug --stacktrace 2>&1 | tee -a ../native-build.log || true
            tail -n 1000 ../native-build.log || true
          fi

      - name: Commit native logs
        if: always()
        run: |
          set -x
          mkdir -p build
          cat /tmp/sdkmanager-native.log > build/native-build.log 2>/dev/null || true
          echo -e "\n\n=== NATIVE BUILD LOG ===\n" >> build/native-build.log
          cat native-build.log >> build/native-build.log 2>/dev/null || echo "no native log" >> build/native-build.log
          ls -lh build/
          git config user.email "bot@arena.ai"
          git config user.name "arena bot"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/anrandaniel2/Minecraft.git
          git fetch origin arena/01a0bb79-minecraft
          git pull --rebase origin arena/01a0bb79-minecraft || true
          git add build/native-build.log || true
          git commit -m "Native log $(date -u) [skip ci]" || true
          git push origin arena/01a0bb79-minecraft || true

      - name: Upload Native APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-native-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            native-build.log
            build/native-build.log
          if-no-files-found: warn

  combine:
    runs-on: ubuntu-latest
    needs: [build-webview-apk, build-native-apk]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine
        run: |
          mkdir -p build
          find artifacts -name "*.apk" -type f -exec cp {} build/ \; || true
          ls -lh build/ || true
          cd build
          if ls *.apk 1> /dev/null 2>&1; then
            largest=$(ls -S *.apk | head -n 1)
            cp "$largest" Eaglercraft26-Android.apk
            ls -lh *.apk > apk-info.txt
            cat apk-info.txt
          else
            echo "No APKs" > apk-info.txt
            find ../artifacts -type f | head -n 100 >> apk-info.txt
            cat apk-info.txt
          fi

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-final-apk
          path: |
            build/*.apk
            build/*.txt
          if-no-files-found: warn
