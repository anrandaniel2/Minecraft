name: Build Android APK (arm64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - 'arena/01a0c03a-minecraft'
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.tscn'
      - '**.gdshader'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'Android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GODOT_VERSION: 4.4.1
      EXPORT_NAME: Android
      APK_PATH: builds/Minecraft-26.3-Android-arm64.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/01a0c03a-minecraft
          fetch-depth: 0
          lfs: true

      - name: Exclude AutoGenerated to avoid duplicate class errors (CS0101/CS0260)
        run: |
          mv Scripts/AutoGenerated /tmp/AutoGenerated 2>/dev/null || true
          echo "Excluded AutoGenerated, remaining C# files:"
          find Scripts -name "*.cs" | wc -l

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot 4.4.1 Mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: true
          include-templates: true

      - name: Setup Android SDK (manual)
        run: |
          set -x
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          ls -la latest/bin/
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list | tail -n 50 || true
          ls -la $ANDROID_HOME/build-tools/ || true

      - name: Verify Godot
        run: |
          godot --version
          dotnet --version
          ls -la ~/.local/share/godot/export_templates/4.4.1.stable.mono/ | head -n 30 || true

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Setup export_presets arm64 only
        run: |
          mkdir -p builds Android
          cat > export_presets.cfg << 'CFG'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="builds/Minecraft-26.3-Android-arm64.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=21
          gradle_build/target_sdk=34
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=26300
          version/name="26.3-Wilderness-Bound"
          package/unique_name="com.mojang.minecraft.godot"
          package/name="Minecraft Godot"
          package/show_cursor=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher=true
          package/show_cursor_in_tv=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/32_bits_framebuffer=true
          graphics/opengl_debug=false
          graphics/transparent_status_bar=false
          graphics/16_bits_framebuffer=false
          screen/immersive_mode=true
          screen/orientation=1
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          permissions/custom_permissions=PackedStringArray()
          permissions/internet=true
          permissions/vibrate=true
          permissions/wake_lock=true
          permissions/modify_audio_settings=true
          CFG
          cp export_presets.cfg Android/export_presets.cfg
          cat export_presets.cfg

      - name: Import project
        run: |
          godot --headless --import --path . 2>&1 | tail -n 100 || true
          ls -la .godot/ | head -n 20 || true

      - name: Build C# solution
        run: |
          set -x
          dotnet restore Minecraft.csproj 2>&1 | tail -n 20
          echo "=== DOTNET BUILD ==="
          dotnet build Minecraft.csproj --configuration ExportRelease 2>&1 | tee /tmp/dotnet_build.log | tail -n 200
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "C# BUILD FAILED with exit $BUILD_EXIT"
            cat /tmp/dotnet_build.log | tail -n 100
            exit 1
          fi
          echo "C# BUILD SUCCEEDED - skipping godot --build-solutions (known to hang headless, dotnet build already built it)"

      - name: Export APK (arm64 only)
        run: |
          set -x
          mkdir -p builds
          echo "Exporting debug (gradle_build=true required for C#)..."
          godot --headless --path . --export-debug "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tee builds/export.log | tail -n 500
          EXPORT_EXIT=${PIPESTATUS[0]}
          echo "Export debug exit code: $EXPORT_EXIT"
          cat builds/export.log | tail -n 300 || true
          if [ ! -f "builds/Minecraft-26.3-Android-arm64.apk" ]; then
            echo "Debug failed, trying release..."
            godot --headless --path . --export-release "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tee -a builds/export.log | tail -n 500
            EXPORT_EXIT2=${PIPESTATUS[0]}
            echo "Export release exit code: $EXPORT_EXIT2"
          fi
          ls -lh builds/ || true
          find . -maxdepth 3 -name "*.apk" | head -n 20 || true
          if [ -f builds/Minecraft-26.3-Android-arm64.apk ]; then
            echo "APK SUCCESS size=$(du -h builds/Minecraft-26.3-Android-arm64.apk)"
            unzip -l builds/Minecraft-26.3-Android-arm64.apk 2>/dev/null | grep lib/ | head -n 30 || true
          else
            echo "APK FAILED - export.log:"
            cat builds/export.log || true
            echo "Failing job to show log"
            exit 1
          fi

      - name: Verify APK arm64 only
        run: |
          APK=builds/Minecraft-26.3-Android-arm64.apk
          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            ls -R builds/ || true
            cat builds/export.log | tail -n 200 || true
            exit 1
          else
            echo "APK size: $(du -h $APK)"
            unzip -l "$APK" 2>/dev/null | grep -E "lib/" | head -n 100 || true
            echo "Checking arch..."
            unzip -l "$APK" 2>/dev/null | grep -c "arm64-v8a" || true
            unzip -l "$APK" 2>/dev/null | grep -c "armeabi-v7a" || true
          fi

      - name: Commit export log
        if: always()
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f builds/export.log export_presets.cfg 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Add export log - run ${{ github.run_number }}"
            git push origin HEAD:arena/01a0c03a-minecraft || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-26.3-Android-arm64-APK
          path: |
            builds/
            export_presets.cfg
          retention-days: 14
          if-no-files-found: warn

      - name: Create Release with APK
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-${{ github.run_number }}
          name: Minecraft 26.3 Android arm64 Build ${{ github.run_number }}
          body: |
            Godot 4.4.1 Mono Android APK - arm64 only

            - Arch: arm64-v8a only (armeabi-v7a=false, x86=false, x86_64=false)
            - Version: 26.3 Wilderness Bound
            - Branch: arena/01a0c03a-minecraft
            - Commit: ${{ github.sha }}
            - APK: builds/Minecraft-26.3-Android-arm64.apk

            Controls: D-pad left 8-way, right-side swipe look, Jump/Crouch/Inv/Break/Place
            Features: Greedy meshing, flattened arrays, Nearest filtering, 1300 textures
          files: |
            builds/*.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
