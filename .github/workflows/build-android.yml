name: Build Android APK (arm64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - 'arena/01a0c03a-minecraft'
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.tscn'
      - '**.gdshader'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'Android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GODOT_VERSION: 4.4.1
      EXPORT_NAME: Android
      APK_PATH: builds/Minecraft-26.3-Android-arm64.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/01a0c03a-minecraft
          fetch-depth: 0
          lfs: true

      - name: Exclude AutoGenerated to avoid duplicate class errors (CS0101/CS0260)
        run: |
          mv Scripts/AutoGenerated /tmp/AutoGenerated 2>/dev/null || true
          echo "Excluded AutoGenerated, remaining C# files:"
          find Scripts -name "*.cs" | wc -l

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot 4.4.1 Mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: true
          include-templates: true

      - name: Setup Android SDK (manual) + NDK for C# gradle build
        run: |
          set -x
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          ls -la latest/bin/
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" || true
          sdkmanager --list | tail -n 50 || true
          ls -la $ANDROID_HOME/build-tools/ || true
          ls -la $ANDROID_HOME/ndk/ || true

      - name: Verify Godot
        run: |
          godot --version
          dotnet --version
          ls -la ~/.local/share/godot/export_templates/4.4.1.stable.mono/ | head -n 30 || true

      - name: Create debug keystore and install Android build template (real, not placeholder)
        run: |
          set -x
          mkdir -p ~/.android ~/.config/godot
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          echo "=== Setting up Godot editor settings for Android SDK ==="
          ANDROID_SDK=$HOME/android-sdk
          cat > ~/.config/godot/editor_settings-4.4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF
          cat ~/.config/godot/editor_settings-4.4.tres
          echo "=== Installing Android build template (required for C# export, must be real not placeholder) ==="
          # Search for android_source.zip in ALL possible locations (runner has it in different places)
          echo "Searching for android_source.zip in HOME and ROOT..."
          find $HOME /root -name "android_source.zip" 2>/dev/null | head -n 20 || true
          echo "Listing export_templates dirs:"
          ls -la $HOME/.local/share/godot/export_templates/ 2>/dev/null | head -n 20 || true
          ls -la /root/.local/share/godot/export_templates/ 2>/dev/null | head -n 20 || true
          ls -la $HOME/.local/share/godot/export_templates/4.4.1.stable.mono/ 2>/dev/null | head -n 100 || true
          ls -la /root/.local/share/godot/export_templates/4.4.1.stable.mono/ 2>/dev/null | head -n 100 || true
          # Try to find template dir with android_source.zip
          TEMPLATE_DIR=""
          for dir in "$HOME/.local/share/godot/export_templates/4.4.1.stable.mono" "$HOME/.local/share/godot/export_templates/4.4.1.stable" "/root/.local/share/godot/export_templates/4.4.1.stable.mono" "/root/.local/share/godot/export_templates/4.4.1.stable" "$HOME/.local/share/godot/export_templates/4.4.1.stable.mono" "/home/runner/.local/share/godot/export_templates/4.4.1.stable.mono"; do
            if [ -f "$dir/android_source.zip" ]; then
              echo "Found android_source.zip at $dir"
              TEMPLATE_DIR="$dir"
              break
            fi
          done
          # If still not found, search whole filesystem for it (may take time but worth it)
          if [ -z "$TEMPLATE_DIR" ]; then
            echo "Not found in common dirs, searching entire home..."
            FOUND=$(find $HOME /root /home -name "android_source.zip" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              echo "Found via find: $FOUND"
              TEMPLATE_DIR=$(dirname "$FOUND")
            fi
          fi
          echo "Using TEMPLATE_DIR=$TEMPLATE_DIR"
          if [ -n "$TEMPLATE_DIR" ] && [ -f "$TEMPLATE_DIR/android_source.zip" ]; then
            echo "Found android_source.zip, extracting to android/build"
            mkdir -p android
            rm -rf android/build /tmp/android_template
            mkdir -p /tmp/android_template
            unzip -q $TEMPLATE_DIR/android_source.zip -d /tmp/android_template || true
            ls -la /tmp/android_template/ | head -n 100 || true
            # The zip contains build/ folder or android_source/ folder or files directly
            if [ -d "/tmp/android_template/build" ]; then
              mv /tmp/android_template/build android/build
            elif [ -d "/tmp/android_template/android_source" ]; then
              mv /tmp/android_template/android_source android/build
            elif [ -d "/tmp/android_template/android" ]; then
              if [ -d "/tmp/android_template/android/build" ]; then
                mv /tmp/android_template/android/build android/build
              else
                mv /tmp/android_template/android android/build || true
              fi
            else
              # Unzip directly to android/ as fallback
              rm -rf android/build
              unzip -q $TEMPLATE_DIR/android_source.zip -d android/ || true
              if [ -d "android/android_source" ]; then
                mv android/android_source android/build
              elif [ -d "android/build" ]; then
                echo "build exists after direct unzip"
              else
                # Last resort: the zip might contain files directly, move them to build/
                mkdir -p android/build
                mv android/*.gradle android/build/ 2>/dev/null || true
                mv android/gradlew android/build/ 2>/dev/null || true
              fi
            fi
            chmod +x android/build/gradlew 2>/dev/null || true
            echo "Android build template installed at android/build"
            ls -la android/build/ | head -n 100 || true
            ls -lh android/build/gradlew 2>&1 | head -n 5 || echo "no gradlew"
            ls -lh android/build/build.gradle 2>&1 | head -n 5 || echo "no build.gradle"
          else
            echo "ERROR: android_source.zip not found anywhere after exhaustive search!"
            echo "Listing all zips in HOME:"
            find $HOME /root -type f -name "*.zip" 2>/dev/null | head -n 30 || true
            if [ -d "android/build" ]; then
              echo "Using existing android/build from repo (minimal placeholder, will produce 4KB APK)"
              ls -la android/build/ | head -n 30 || true
            else
              mkdir -p android/build
            fi
          fi
          echo "Final android/ structure:"
          find android -type f | head -n 200 || true
          if [ ! -f "android/build/gradlew" ]; then
            echo "WARNING: gradlew not found - will produce placeholder 4KB APK!"
          else
            echo "SUCCESS: gradlew found - should produce real APK"
          fi

      - name: Setup export_presets arm64 only
        run: |
          mkdir -p builds Android
          cat > export_presets.cfg << 'CFG'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="builds/Minecraft-26.3-Android-arm64.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=21
          gradle_build/target_sdk=34
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=26300
          version/name="26.3-Wilderness-Bound"
          package/unique_name="com.mojang.minecraft.godot"
          package/name="Minecraft Godot"
          package/show_cursor=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher=true
          package/show_cursor_in_tv=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/32_bits_framebuffer=true
          graphics/opengl_debug=false
          graphics/transparent_status_bar=false
          graphics/16_bits_framebuffer=false
          screen/immersive_mode=true
          screen/orientation=1
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          permissions/custom_permissions=PackedStringArray()
          permissions/internet=true
          permissions/vibrate=true
          permissions/wake_lock=true
          permissions/modify_audio_settings=true
          CFG
          cp export_presets.cfg Android/export_presets.cfg
          cat export_presets.cfg

      - name: Import project and Build C# (fix SDK 10 vs 8 + autoloads)
        run: |
          set -x
          echo "=== DOTNET SDKs before cleanup ==="
          dotnet --list-sdks
          ls /usr/share/dotnet/sdk/ | head -n 30 || true
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          # Remove ALL .NET 9 and 10 SDKs which cause Godot to find wrong SDK (10.0.303 etc) and fail to load assembly
          sudo rm -rf /usr/share/dotnet/sdk/10.* /usr/share/dotnet/sdk/9.* 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet/sdk/10.0.400 /usr/share/dotnet/sdk/10.0.303 /usr/share/dotnet/sdk/10.0.100 2>/dev/null || true
          echo "=== DOTNET SDKs after cleanup (should only have 8.0.x) ==="
          dotnet --list-sdks
          dotnet --version
          echo "=== RESTORE ==="
          dotnet restore Minecraft.csproj 2>&1 | tail -n 20
          echo "=== BUILD DEBUG (for editor import, fixes autoload compile errors) ==="
          dotnet build Minecraft.csproj --configuration Debug 2>&1 | tee /tmp/dotnet_debug.log | tail -n 100
          echo "=== BUILD EXPORTRELEASE (for export) ==="
          dotnet build Minecraft.csproj --configuration ExportRelease 2>&1 | tee /tmp/dotnet_build.log | tail -n 200
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "C# BUILD FAILED with exit $BUILD_EXIT"
            cat /tmp/dotnet_build.log | tail -n 100
            exit 1
          fi
          echo "C# BUILD SUCCEEDED"
          ls -lh .godot/mono/temp/bin/Debug/ 2>/dev/null | head -n 20 || true
          ls -lh .godot/mono/temp/bin/ExportRelease/ 2>/dev/null | head -n 20 || true
          echo "=== GODOT IMPORT (after C# build so autoloads compile) ==="
          timeout 120 godot --headless --import --path . 2>&1 | tail -n 100 || echo "import timed out, continuing"
          ls -la .godot/ | head -n 20 || true
          echo "=== Check if autoloads now compile ==="
          ls -lh .godot/mono/temp/bin/Debug/ | head -n 20 || true

      - name: Export APK (arm64 only) - must be real >20MB not placeholder 2.4K
        run: |
          set -x
          mkdir -p builds
          echo "=== PRE-EXPORT CHECKS ==="
          echo "android/build exists: $(ls -la android/build/ | head -n 20 || echo no)"
          echo "gradlew exists: $(ls -lh android/build/gradlew 2>&1 || echo no gradlew - will produce placeholder)"
          echo "export_presets.cfg:"
          cat export_presets.cfg | head -n 40
          echo "=== EXPORTING DEBUG (gradle_build=true, should take 20-30m for real APK) ==="
          timeout 1800 godot --headless --path . --export-debug "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tee builds/export.log | tail -n 1000
          EXPORT_EXIT=${PIPESTATUS[0]}
          echo "Export debug exit code: $EXPORT_EXIT (124 means timeout after 30m)"
          ls -lh builds/ || true
          if [ -f "builds/Minecraft-26.3-Android-arm64.apk" ]; then
            APK_SIZE=$(stat -c%s "builds/Minecraft-26.3-Android-arm64.apk" 2>/dev/null || stat -f%z "builds/Minecraft-26.3-Android-arm64.apk" 2>/dev/null || echo 0)
            echo "APK size bytes: $APK_SIZE"
            if [ "$APK_SIZE" -lt 1000000 ]; then
              echo "ERROR: APK is placeholder (<1MB, likely 2.4K), not real! Size=$APK_SIZE"
              echo "This means gradle build didn't run - check android/build/gradlew and export.log"
              cat builds/export.log | tail -n 500 || true
              echo "Trying release export as fallback..."
              timeout 1800 godot --headless --path . --export-release "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tee -a builds/export.log | tail -n 1000
            fi
          else
            echo "Debug APK not found, trying release..."
            timeout 1800 godot --headless --path . --export-release "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tee -a builds/export.log | tail -n 1000
          fi
          ls -lh builds/ || true
          find . -maxdepth 3 -name "*.apk" | head -n 20 || true
          if [ -f builds/Minecraft-26.3-Android-arm64.apk ]; then
            APK_SIZE=$(stat -c%s "builds/Minecraft-26.3-Android-arm64.apk" 2>/dev/null || echo 0)
            echo "Final APK size: $APK_SIZE bytes = $(du -h builds/Minecraft-26.3-Android-arm64.apk)"
            if [ "$APK_SIZE" -lt 5000000 ]; then
              echo "ERROR: APK still placeholder (<5MB), failing job to show log"
              cat builds/export.log | tail -n 1000 || true
              exit 1
            fi
            echo "APK SUCCESS - real APK >5MB"
            unzip -l builds/Minecraft-26.3-Android-arm64.apk 2>/dev/null | grep lib/ | head -n 50 || true
            echo "Checking arm64 only:"
            unzip -l builds/Minecraft-26.3-Android-arm64.apk 2>/dev/null | grep -E "lib/arm64|lib/armeabi|lib/x86" | head -n 20 || true
          else
            echo "APK FAILED - no file produced"
            cat builds/export.log | tail -n 1000 || true
            exit 1
          fi

      - name: Verify APK arm64 only
        run: |
          APK=builds/Minecraft-26.3-Android-arm64.apk
          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            ls -R builds/ || true
            cat builds/export.log | tail -n 200 || true
            exit 1
          else
            echo "APK size: $(du -h $APK)"
            unzip -l "$APK" 2>/dev/null | grep -E "lib/" | head -n 100 || true
            echo "Checking arch..."
            unzip -l "$APK" 2>/dev/null | grep -c "arm64-v8a" || true
            unzip -l "$APK" 2>/dev/null | grep -c "armeabi-v7a" || true
          fi

      - name: Commit export log
        if: always()
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f builds/export.log export_presets.cfg 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Add export log - run ${{ github.run_number }}"
            git push origin HEAD:arena/01a0c03a-minecraft || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-26.3-Android-arm64-APK
          path: |
            builds/
            export_presets.cfg
          retention-days: 14
          if-no-files-found: warn

      - name: Create Release with APK
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-${{ github.run_number }}
          name: Minecraft 26.3 Android arm64 Build ${{ github.run_number }}
          body: |
            Godot 4.4.1 Mono Android APK - arm64 only

            - Arch: arm64-v8a only (armeabi-v7a=false, x86=false, x86_64=false)
            - Version: 26.3 Wilderness Bound
            - Branch: arena/01a0c03a-minecraft
            - Commit: ${{ github.sha }}
            - APK: builds/Minecraft-26.3-Android-arm64.apk

            Controls: D-pad left 8-way, right-side swipe look, Jump/Crouch/Inv/Break/Place
            Features: Greedy meshing, flattened arrays, Nearest filtering, 1300 textures
          files: |
            builds/*.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
