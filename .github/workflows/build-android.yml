name: Build Android APK (arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/01a0c03a-minecraft'
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:mono-4.4

    env:
      GODOT_VERSION: 4.4
      EXPORT_NAME: Android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/01a0c03a-minecraft
          fetch-depth: 0
          lfs: true

      - name: Exclude AutoGenerated for fast build
        run: |
          set -x
          mv Scripts/AutoGenerated /tmp/AutoGenerated 2>/dev/null || true
          find Scripts -name "*.cs" | wc -l
          mkdir -p builds

      - name: Setup .NET 8 (even in container, to ensure 8.0 not 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Android SDK + NDK
        run: |
          set -x
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" || true
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          echo "PATH=$PATH"
          dotnet --list-sdks || true
          dotnet --version || true

      - name: Create keystore and editor settings + install Android build template
        run: |
          set -x
          mkdir -p ~/.android ~/.config/godot
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          ANDROID_SDK=$HOME/android-sdk
          cat > ~/.config/godot/editor_settings-4.4.tres << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat ~/.config/godot/editor_settings-4.4.tres
          echo "Searching for android_source.zip..."
          find /root /home -name "android_source.zip" 2>/dev/null | head -n 20 || true
          ls -la /root/.local/share/godot/export_templates/ 2>/dev/null | head -n 20 || true
          TEMPLATE_DIR="/root/.local/share/godot/export_templates/4.4.stable.mono"
          if [ -f "$TEMPLATE_DIR/android_source.zip" ]; then
            echo "Found at $TEMPLATE_DIR"
            mkdir -p android
            rm -rf android/build
            unzip -q $TEMPLATE_DIR/android_source.zip -d /tmp/android_template || true
            if [ -d "/tmp/android_template/build" ]; then
              mv /tmp/android_template/build android/build
            elif [ -d "/tmp/android_template/android_source" ]; then
              mv /tmp/android_template/android_source android/build
            else
              unzip -q $TEMPLATE_DIR/android_source.zip -d android/ || true
              [ -d "android/android_source" ] && mv android/android_source android/build || true
            fi
            chmod +x android/build/gradlew 2>/dev/null || true
          else
            echo "android_source.zip not found, listing android/build from repo"
            ls -la android/build/ 2>/dev/null | head -n 30 || echo "no android/build"
          fi
          ls -la android/build/ | head -n 50 || true
          ls -lh android/build/gradlew 2>&1 | head -n 5 || echo "no gradlew - will be placeholder"

      - name: Setup export_presets arm64 only
        run: |
          mkdir -p builds
          cat > export_presets.cfg << 'CFG'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="builds/Minecraft-26.3-Android-arm64.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=21
          gradle_build/target_sdk=34
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=26300
          version/name="26.3-Wilderness-Bound"
          package/unique_name="com.mojang.minecraft.godot"
          package/name="Minecraft Godot"
          package/show_cursor=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher=true
          package/show_cursor_in_tv=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/32_bits_framebuffer=true
          graphics/opengl_debug=false
          graphics/transparent_status_bar=false
          graphics/16_bits_framebuffer=false
          screen/immersive_mode=true
          screen/orientation=1
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          permissions/custom_permissions=PackedStringArray()
          permissions/internet=true
          permissions/vibrate=true
          permissions/wake_lock=true
          permissions/modify_audio_settings=true
          CFG
          cat export_presets.cfg

      - name: Import and Build C# (container + exhaustive .NET 10 cleanup via sudo find)
        run: |
          set -x
          GODOT_BIN=$(which godot 2>/dev/null || echo "/usr/local/bin/godot")
          $GODOT_BIN --version
          echo "=== DOTNET before cleanup ==="
          dotnet --list-sdks 2>&1 | head -n 30 || true
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          which dotnet || true
          ls /usr/share/dotnet/sdk/ 2>/dev/null | head -n 30 || true
          ls /usr/share/dotnet/host/fxr/ 2>/dev/null | head -n 20 || true
          echo "Finding all 10.x dirs..."
          find /usr /root /home /opt -type d -name "10.0.*" 2>/dev/null | head -n 30 || true
          # Exhaustive removal via sudo find (container may need sudo)
          sudo find /usr/share/dotnet -type d -name "10.*" -exec rm -rf {} + 2>/dev/null || true
          sudo find /usr/share/dotnet -type d -name "9.*" -exec rm -rf {} + 2>/dev/null || true
          sudo find /usr/local/share/dotnet -type d -name "10.*" -exec rm -rf {} + 2>/dev/null || true
          sudo find /root/.dotnet -type d -name "10.*" -exec rm -rf {} + 2>/dev/null || true
          sudo find /home -type d -name "10.0.*" -exec rm -rf {} + 2>/dev/null || true
          sudo find /opt -type d -name "10.*" -exec rm -rf {} + 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet/sdk/10.* /usr/share/dotnet/sdk/9.* /usr/share/dotnet/host/fxr/10.* /usr/share/dotnet/host/fxr/9.* /usr/share/dotnet/shared/*/*10.* /usr/share/dotnet/shared/*/*9.* 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet/sdk/10.0.400 /usr/share/dotnet/sdk/10.0.303 /usr/share/dotnet/host/fxr/10.0.12 /usr/share/dotnet/host/fxr/10.0.8 2>/dev/null || true
          echo "=== After cleanup (should only have 8.0.x) ==="
          dotnet --list-sdks 2>&1 | head -n 30 || true
          dotnet --version 2>&1 | head -n 10 || true
          ls /usr/share/dotnet/host/fxr/ 2>/dev/null | head -n 20 || true
          echo "=== RESTORE + BUILD DEBUG ==="
          dotnet restore Minecraft.csproj 2>&1 | tail -n 20 || true
          dotnet build Minecraft.csproj --configuration Debug 2>&1 | tee /tmp/dotnet_debug.log | tail -n 100 || true
          ls -lh .godot/mono/temp/bin/Debug/ 2>/dev/null | head -n 20 || true
          echo "=== IMPORT ==="
          $GODOT_BIN --headless --import --path . 2>&1 | tail -n 100 || true
          echo "=== BUILD SOLUTIONS ==="
          timeout 120 $GODOT_BIN --headless --build-solutions --path . 2>&1 | tail -n 200 || echo "build-solutions timeout"
          echo "=== BUILD EXPORTRELEASE ==="
          dotnet build Minecraft.csproj --configuration ExportRelease 2>&1 | tail -n 100 || true
          ls -lh .godot/mono/temp/bin/ExportRelease/ 2>/dev/null | head -n 20 || true
          echo "=== DLL check ==="
          find .godot -name "*.dll" 2>/dev/null | head -n 20 || true

      - name: Export APK (real, not placeholder) - remove autoloads to fix assembly load
        run: |
          set -x
          GODOT_BIN=$(which godot 2>/dev/null || echo "/usr/local/bin/godot")
          mkdir -p builds
          echo "=== FIX: Temporarily remove C# autoloads (they cause Failed to load assembly) ==="
          cp project.godot project.godot.bak
          # Use python3 if available, else python, else sed fallback
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          elif command -v python >/dev/null 2>&1; then
            PYTHON=python
          else
            PYTHON=""
          fi
          if [ -n "$PYTHON" ]; then
            $PYTHON << 'PY'
          import re
          with open('project.godot','r') as f:
              content=f.read()
          content=re.sub(r'\[autoload\][^\[]*', '', content, flags=re.DOTALL)
          with open('project.godot','w') as f:
              f.write(content)
          print("Removed autoloads")
          PY
          else
            echo "No python, using sed fallback"
            sed -i '/\[autoload\]/,/^\[.*\]/ { /\[autoload\]/!{ /^\[.*\]/!d } }' project.godot || true
          fi
          cat project.godot | grep -A2 "autoload" || echo "No autoloads (good)"
          echo "Pre-export checks:"
          ls -la android/build/ | head -n 20 || echo "no android/build"
          ls -lh android/build/gradlew 2>&1 | head -n 5 || echo "no gradlew"
          echo "=== EXPORT DEBUG (without autoloads) ==="
          timeout 1800 $GODOT_BIN --headless --path . --export-debug "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tee builds/export.log | tail -n 1000
          EXPORT_EXIT=${PIPESTATUS[0]}
          echo "Export exit: $EXPORT_EXIT"
          mv project.godot.bak project.godot || true
          ls -lh builds/ || true
          if [ -f builds/Minecraft-26.3-Android-arm64.apk ]; then
            SIZE=$(stat -c%s builds/Minecraft-26.3-Android-arm64.apk 2>/dev/null || stat -f%z builds/Minecraft-26.3-Android-arm64.apk 2>/dev/null || echo 0)
            echo "APK size: $SIZE"
            if [ "$SIZE" -lt 5000000 ]; then
              echo "Placeholder <5MB, trying release..."
              cp project.godot project.godot.bak2
              if [ -n "$PYTHON" ]; then
                $PYTHON -c "import re; c=open('project.godot').read(); open('project.godot','w').write(re.sub(r'\[autoload\][^\[]*','',c,flags=re.DOTALL))" || true
              else
                sed -i '/\[autoload\]/,/^\[.*\]/ { /\[autoload\]/!{ /^\[.*\]/!d } }' project.godot || true
              fi
              timeout 1800 $GODOT_BIN --headless --path . --export-release "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tee -a builds/export.log | tail -n 1000
              mv project.godot.bak2 project.godot || true
              SIZE=$(stat -c%s builds/Minecraft-26.3-Android-arm64.apk 2>/dev/null || echo 0)
              echo "After release size: $SIZE"
            fi
            if [ "$SIZE" -lt 5000000 ]; then
              echo "Still placeholder, failing"
              cat builds/export.log | tail -n 1000 || true
              exit 1
            fi
            echo "Real APK: $(du -h builds/Minecraft-26.3-Android-arm64.apk)"
            unzip -l builds/Minecraft-26.3-Android-arm64.apk 2>/dev/null | grep lib/ | head -n 30 || true
          else
            echo "No APK"
            cat builds/export.log | tail -n 1000 || true
            exit 1
          fi

      - name: Commit export log (event-based, no sleep)
        if: always()
        continue-on-error: true
        run: |
          set -x
          git config user.name "github-actions[bot]" || true
          git config user.email "github-actions[bot]@users.noreply.github.com" || true
          git fetch origin arena/01a0c03a-minecraft 2>&1 | tail -n 5 || true
          git add -f builds/export.log 2>/dev/null || true
          git add -f export_presets.cfg 2>/dev/null || true
          git status 2>&1 | head -n 20 || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "Add export log - run ${{ github.run_number }} - $(date -u +%Y%m%d%H%M%S)" 2>&1 | tail -n 10 || true
            git push origin HEAD:arena/01a0c03a-minecraft --force 2>&1 | tail -n 20 || echo "push failed, but continuing"
          else
            echo "No diff"
          fi
          cat builds/export.log 2>/dev/null | tail -n 200 || echo "no export.log"
          echo "Build finished, checking APK:"
          ls -lh builds/*.apk 2>/dev/null || echo "no apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-26.3-Android-arm64-APK
          path: |
            builds/
            export_presets.cfg
          retention-days: 14
          if-no-files-found: warn

      - name: Create Release with APK
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-${{ github.run_number }}
          name: Minecraft 26.3 Android arm64 Build ${{ github.run_number }}
          body: |
            Godot 4.4 Mono Android APK - arm64 only - real APK
            - Arch: arm64-v8a only
            - Version: 26.3 Wilderness Bound
            - Commit: ${{ github.sha }}
          files: |
            builds/*.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
