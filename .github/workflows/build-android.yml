name: Build Android APK (arm64)

# Builds a REAL Godot 4.4.1 Mono Android APK (gradle export, arm64-v8a only)
# with the game's actual assets (textures, scenes, C# assemblies).
#
# Previous versions of this workflow published hand-made 2.4KB placeholder APKs
# when the export failed. This workflow can no longer do that:
#   - the placeholder/stub files are gone from the repository (builds/ is ignored),
#   - the export must succeed and pass .github/scripts/verify_android_apk.py
#     (size, ELF libs, DEX, real asset payload, arm64 only, signed),
#   - artifacts and releases are uploaded only when verification passes.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - '**'
    paths:
      - 'Scripts/**'
      - 'Scenes/**'
      - 'Assets/**'
      - 'Shaders/**'
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/build-android.yml'
      - '.github/scripts/**'

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GODOT_VERSION: 4.4.1
      GODOT_VERSION_FULL: 4.4.1.stable.mono
      APK_PATH: builds/Minecraft-26.3-Android-arm64.apk
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Remove .NET 9/10 SDKs (Godot 4.4 Mono must not pick them up)
        run: |
          set -x
          for ROOT in /usr/share/dotnet /usr/lib/dotnet; do
            sudo rm -rf "$ROOT"/sdk/9.* "$ROOT"/sdk/10.* "$ROOT"/sdk/11.* 2>/dev/null || true
            sudo rm -rf "$ROOT"/host/fxr/9.* "$ROOT"/host/fxr/10.* "$ROOT"/host/fxr/11.* 2>/dev/null || true
          done
          dotnet --list-sdks
          dotnet --list-runtimes | head -n 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot 4.4.1 Mono + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: true
          include-templates: true

      - name: Cache NuGet, Gradle and Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/android-sdk
          key: android-build-deps-${{ runner.os }}-v1
          restore-keys: |
            android-build-deps-${{ runner.os }}-

      - name: Setup Android SDK (platform-tools, platform 34, build-tools)
        run: |
          set -euxo pipefail
          if [ ! -x "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            cd "$HOME/android-sdk/cmdline-tools"
            curl -fsSL --retry 3 -o cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            rm -rf latest cmdline-tools.zip
            mv cmdline-tools latest
          fi
          {
            echo "ANDROID_HOME=$HOME/android-sdk"
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk"
          } >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls -la "$HOME/android-sdk/platform-tools" | head -n 5
          ls -la "$HOME/android-sdk/build-tools" || true

      - name: Create keystore and Godot editor settings
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/ci.keystore" \
            -storepass android -alias cikey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Build,O=Godot,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/ci.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=cikey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android/ci.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=cikey"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
          } >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$HOME/android-sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/ci.keystore"
          export/android/debug_keystore_user = "cikey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Install real Android build template (android_source.zip -> android/build)
        run: |
          set -euxo pipefail
          TPL_DIR="$HOME/.local/share/godot/export_templates"
          ls -la "$TPL_DIR" || true
          ls -la "$TPL_DIR"/*/ | head -n 40 || true
          ZIP=""
          for d in "$TPL_DIR/$GODOT_VERSION_FULL" "$TPL_DIR/4.4.1.stable"; do
            if [ -f "$d/android_source.zip" ]; then ZIP="$d/android_source.zip"; break; fi
          done
          if [ -z "$ZIP" ]; then
            ZIP=$(find "$TPL_DIR" -name 'android_source.zip' 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "android_source.zip not found in installed templates; downloading Mono export templates..."
            curl -fsSL --retry 3 -o /tmp/godot-mono-templates.tpz \
              "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_mono_export_templates.tpz"
            mkdir -p "$TPL_DIR/$GODOT_VERSION_FULL"
            unzip -j -o /tmp/godot-mono-templates.tpz "templates/android_source.zip" -d "$TPL_DIR/$GODOT_VERSION_FULL"
            ZIP="$TPL_DIR/$GODOT_VERSION_FULL/android_source.zip"
          fi
          echo "Using Android build template: $ZIP"
          # Install exactly like the Godot editor does (Project > Install Android Build Template):
          # unzip android_source.zip into android/build, stamp android/.build_version.
          rm -rf android
          mkdir -p android/build
          unzip -q "$ZIP" -d android/build
          printf '%s\n' "$GODOT_VERSION_FULL" > android/.build_version
          : > android/build/.gdignore
          chmod +x android/build/gradlew
          echo "Installed android/build:"
          ls -la android/build | head -n 30
          test -x android/build/gradlew
          test -f android/build/build.gradle
          test -f android/build/settings.gradle

      - name: Restore and build C#
        run: |
          set -euxo pipefail
          dotnet --list-sdks
          dotnet restore Minecraft.csproj
          # Debug build so the editor can compile the autoload scripts during import.
          dotnet build Minecraft.csproj -c Debug --no-restore
          # ExportRelease is the configuration used by the Android export.
          dotnet build Minecraft.csproj -c ExportRelease

      - name: Godot import (generate resource metadata for all assets)
        run: |
          set -x
          timeout 900 godot --headless --path . --import 2>&1 | tail -n 60 \
            || echo "godot --import returned non-zero; the export step re-scans the project"

      - name: Export APK (arm64 only, gradle build)
        run: |
          set -x
          mkdir -p builds
          if [ "$BUILD_TYPE" = "debug" ]; then MODE="--export-debug"; else MODE="--export-release"; fi
          echo "Exporting with $MODE ..."
          set +e
          timeout 3600 godot --headless --path . $MODE "Android" "$APK_PATH" --verbose 2>&1 | tee builds/export.log
          EXPORT_EXIT=${PIPESTATUS[0]}
          set -e
          echo "Godot export exit code: $EXPORT_EXIT"
          tail -n 100 builds/export.log || true
          ls -lh builds/ || true
          if [ "$EXPORT_EXIT" -ne 0 ]; then
            echo "::error::Godot export failed with exit code $EXPORT_EXIT (see builds/export.log in the uploaded logs artifact)"
            exit 1
          fi
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

      - name: Verify APK is a real build with actual assets
        run: python3 .github/scripts/verify_android_apk.py "$APK_PATH"

      - name: SDK tool checks (apksigner, zipalign, aapt2)
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/34.0.0"
          {
            echo "== apksigner verify =="
            "$BT/apksigner" verify --verbose --print-certs "$APK_PATH"
            echo "== zipalign check =="
            if "$BT/zipalign" 2>&1 | grep -q -- '-P'; then
              "$BT/zipalign" -c -P 16 4 "$APK_PATH"
            else
              "$BT/zipalign" -c 4 "$APK_PATH"
            fi
            echo "== aapt2 dump badging =="
            "$BT/aapt2" dump badging "$APK_PATH" | sed -n 1,20p
            echo "== manifest flags =="
            "$BT/aapt2" dump xmltree "$APK_PATH" --file AndroidManifest.xml \
              | grep -iE 'extractNativeLibs|uses-sdk|minSdkVersion|targetSdkVersion|versionCode|versionName|package=' \
              | head -30
          } | tee builds/sdk-checks.txt
          {
            echo ""
            echo "<details><summary>SDK tool checks (apksigner / zipalign / aapt2)</summary>"
            echo ""
            echo '```'
            cat builds/sdk-checks.txt
            echo '```'
            echo "</details>"
          } >> builds/apk-report.md
          echo "::notice title=SDK checks::apksigner + zipalign + aapt2 validation passed"

      - name: Compose release notes
        run: |
          {
            echo "Godot 4.4.1 Mono Android APK - arm64-v8a only (verified real build)"
            echo
            echo "- Arch: arm64-v8a only"
            echo "- Version: 26.3 Wilderness Bound (26300)"
            echo "- Commit: ${{ github.sha }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat builds/apk-report.md
          } > builds/release-notes.md
          mv builds/release-notes.md builds/apk-report.md

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-log
          path: builds/export.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-26.3-Android-arm64-APK
          path: |
            builds/*.apk
            builds/*.sha256
            builds/apk-report.md
          retention-days: 14
          if-no-files-found: error

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-${{ github.run_number }}
          name: Minecraft 26.3 Android arm64 Build ${{ github.run_number }}
          body_path: builds/apk-report.md
          files: |
            builds/*.apk
            builds/*.sha256
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
