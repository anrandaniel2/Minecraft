name: Build Android APK Fast (arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/01a0c03a-minecraft'
    paths:
      - '.github/workflows/build-android-fast.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:mono-4.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0c03a-minecraft
          fetch-depth: 1

      - name: Fast setup - exclude AutoGenerated for speed
        run: |
          set -x
          echo "Moving AutoGenerated away to speed up C# build (39 files vs 1221)"
          mv Scripts/AutoGenerated /tmp/AutoGenerated 2>/dev/null || true
          ls Scripts/ | head -n 20
          mkdir -p builds

      - name: Create keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Setup export_presets arm64 only (prebuilt, fast)
        run: |
          cat > export_presets.cfg << 'CFG'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="builds/Minecraft-26.3-Android-arm64.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=21
          gradle_build/target_sdk=34
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=26300
          version/name="26.3-Wilderness-Bound"
          package/unique_name="com.mojang.minecraft.godot"
          package/name="Minecraft Godot"
          package/show_cursor=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher=true
          package/show_cursor_in_tv=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/32_bits_framebuffer=true
          graphics/opengl_debug=false
          graphics/transparent_status_bar=false
          graphics/16_bits_framebuffer=false
          screen/immersive_mode=true
          screen/orientation=1
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          permissions/custom_permissions=PackedStringArray()
          permissions/internet=true
          permissions/vibrate=true
          permissions/wake_lock=true
          permissions/modify_audio_settings=true
          CFG
          cat export_presets.cfg

      - name: Import and Build
        run: |
          set -x
          GODOT_BIN=$(which godot 2>/dev/null || echo "/usr/local/bin/godot")
          $GODOT_BIN --version
          echo "Templates:"
          ls -la /root/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la /root/.local/share/godot/export_templates/4.4.stable.mono/ 2>/dev/null | head -n 30 || true
          echo "Import..."
          $GODOT_BIN --headless --import --path . 2>&1 | tail -n 50 || true
          echo "Build C#..."
          $GODOT_BIN --headless --build-solutions --path . 2>&1 | tail -n 100 || true

      - name: Export APK arm64
        run: |
          set -x
          GODOT_BIN=$(which godot 2>/dev/null || echo "/usr/local/bin/godot")
          mkdir -p builds
          $GODOT_BIN --headless --path . --export-debug "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tail -n 200 || true
          ls -lh builds/
          if [ ! -f builds/Minecraft-26.3-Android-arm64.apk ]; then
            echo "Debug export failed, trying release..."
            $GODOT_BIN --headless --path . --export-release "Android" builds/Minecraft-26.3-Android-arm64.apk --verbose 2>&1 | tail -n 200 || true
            ls -lh builds/
          fi
          # If still no APK, list why
          if [ ! -f builds/Minecraft-26.3-Android-arm64.apk ]; then
            echo "NO APK PRODUCED"
            find /root/.local -name "*.apk" 2>/dev/null | head -n 20 || true
          else
            echo "APK SUCCESS"
            ls -lh builds/*.apk
            unzip -l builds/*.apk 2>/dev/null | grep lib/ | head -n 20 || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-arm64-APK
          path: builds/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-fast-${{ github.run_number }}
          name: Minecraft Android arm64 Fast ${{ github.run_number }}
          body: |
            Fast build - arm64 only
            - Godot 4.4 Mono prebuilt
            - arm64-v8a=true only
            - Excluded AutoGenerated for speed (39 C# files)
            - APK: Minecraft-26.3-Android-arm64.apk
          files: builds/*.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
