name: Build Eaglercraft Native C++

on:
  push:
    branches:
      - arena/01a0bb79-minecraft
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev build-essential cmake

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release --debug-output 2>&1 | tee configure.log
          echo "=== CMakeCache ==="
          cat build/CMakeCache.txt | head -n 200 || true
          echo "=== End ==="
        continue-on-error: false

      - name: Build
        if: always()
        run: |
          cmake --build build --config Release -j$(nproc) 2>&1 | tee build.log

      - name: Check binary
        if: always()
        run: |
          ls -lh build/ || true
          cat build/CMakeFiles/CMakeError.log || true
          cat build/CMakeFiles/CMakeOutput.log | tail -n 200 || true
          file build/eaglercraft || true
          ldd build/eaglercraft || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-native-linux
          path: |
            build/eaglercraft
            build/assets/
            configure.log
            build.log
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
          if-no-files-found: warn

  build-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bb79-minecraft

      - name: Configure headless
        run: |
          cmake -B build-headless -DCMAKE_BUILD_TYPE=Release -DEAGLER_BUILD_HEADLESS=ON 2>&1 | tee configure-headless.log

      - name: Build headless
        run: |
          cmake --build build-headless --config Release -j$(nproc) 2>&1 | tee build-headless.log

      - name: List
        if: always()
        run: |
          ls -lh build-headless/ || true
          cat build-headless/CMakeFiles/CMakeError.log || true

      - name: Upload headless
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-headless
          path: |
            build-headless/eaglercraft
            configure-headless.log
            build-headless.log
          if-no-files-found: warn
