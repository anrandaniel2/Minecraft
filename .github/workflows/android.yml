name: Android APK

# Builds a ready-to-install .apk on every push to main and on demand.
# Artifacts: blockcraft-debug.apk and (best effort) blockcraft-release.apk.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name stamped into the APK"
        required: false
        default: "1.0.0"

env:
  GODOT_VERSION: 4.7.2
  GODOT_CHANNEL: stable
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 23.2.8568313
  APK_BASENAME: blockcraft
  PACKAGE_NAME: com.example.blockcraft

jobs:
  apk:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r23c
          add-to-path: false

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version
          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$TARGET"
          mv /tmp/templates/templates/* "$TARGET/"
          ls "$TARGET" | head -5

      - name: Create debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the Android toolchain
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          NDK_PATH="${{ steps.ndk.outputs.ndk-path }}"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/ndk_path = "${NDK_PATH}"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/release_keystore = "$HOME/.android/debug.keystore"
          export/android/release_keystore_user = "androiddebugkey"
          export/android/release_keystore_pass = "android"
          export/android/force_kill_after_export = false
          EOF
          echo "editor settings written (sdk: ${ANDROID_SDK_ROOT}, ndk: ${NDK_PATH})"

      - name: Import project (also validates every GDScript)
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -q "SCRIPT ERROR" /tmp/import.log; then
            echo "::error::GDScript errors found during import"
            exit 1
          fi

      - name: Stamp version into the export preset
        if: github.event_name == 'workflow_dispatch'
        run: |
          NAME="${{ github.event.inputs.version_name }}"
          sed -i "s|^version/name=.*|version/name=\"${NAME}\"|" export_presets.cfg
          sed -i "s|^package/unique_name=.*|package/unique_name=\"${PACKAGE_NAME}\"|" export_presets.cfg

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" "build/${APK_BASENAME}-debug.apk"
          ls -lh build

      - name: Export release APK
        continue-on-error: true
        run: |
          set -euo pipefail
          godot --headless --path . --export-release "Android" "build/${APK_BASENAME}-release.apk"
          ls -lh build

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK="build/${APK_BASENAME}-debug.apk"
          test -s "$APK" || { echo "::error::APK was not produced"; exit 1; }
          unzip -l "$APK" | head -20
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump badging "$APK" \
            | grep -E "package:|launchable-activity:|native-code:" || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blockcraft-android
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
