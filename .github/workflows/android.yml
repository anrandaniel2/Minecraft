name: Android APK

# Builds a ready-to-install .apk on every push to main and on demand.
# Artifact: blockcraft-android (debug APK, plus a best-effort release APK).
#
# The Android toolchain is installed by hand instead of through a marketplace
# action so the job only depends on Google's own download servers and on Godot.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name stamped into the APK"
        required: false
        default: "1.0.0"

env:
  GODOT_VERSION: 4.7.2
  GODOT_CHANNEL: stable
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_HOME: /opt/android-sdk
  CMDLINE_TOOLS_BUILD: "11076708"
  BUILD_TOOLS: "34.0.0"
  APK_BASENAME: blockcraft
  PACKAGE_NAME: com.example.blockcraft

jobs:
  apk:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_BUILD}_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "build-tools;${BUILD_TOOLS}" "platforms;android-34" > /dev/null
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          ls "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_SDK_ROOT/platforms"

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version
          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$TARGET"
          mv /tmp/templates/templates/* "$TARGET/"
          echo "templates installed:"
          ls "$TARGET" | head -5

      - name: Create debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12
          ls -l "$HOME/.android/debug.keystore"

      - name: Point Godot at the Android toolchain
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/release_keystore = "$HOME/.android/debug.keystore"
          export/android/release_keystore_user = "androiddebugkey"
          export/android/release_keystore_pass = "android"
          export/android/force_kill_after_export = false
          EOF
          sed -n '1,20p' "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project (validates every GDScript)
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -q "SCRIPT ERROR" /tmp/import.log; then
            echo "::error::GDScript errors found during import"
            exit 1
          fi

      - name: Stamp the version into the export preset
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          NAME="${{ github.event.inputs.version_name }}"
          sed -i "s|^version/name=.*|version/name=\"${NAME}\"|" export_presets.cfg
          sed -i "s|^package/unique_name=.*|package/unique_name=\"${PACKAGE_NAME}\"|" export_presets.cfg

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" "build/${APK_BASENAME}-debug.apk" \
            2>&1 | tee /tmp/export.log
          ls -lh build

      - name: Export release APK
        continue-on-error: true
        run: |
          set -euo pipefail
          godot --headless --path . --export-release "Android" "build/${APK_BASENAME}-release.apk"
          ls -lh build

      - name: Verify the APK
        run: |
          set -euo pipefail
          APK="build/${APK_BASENAME}-debug.apk"
          test -s "$APK" || { echo "::error::APK was not produced"; exit 1; }
          unzip -l "$APK" | head -20
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2" dump badging "$APK" \
            | grep -E "package:|launchable-activity:|native-code:" || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blockcraft-android
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-logs
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7
